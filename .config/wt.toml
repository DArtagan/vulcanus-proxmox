# Worktrunk config for vulcanus-proxmox.
#
# The review workflow lives here rather than as prose in CLAUDE.md because the
# frozen-base mechanics are exact: get the base commit wrong and the pull request
# either closes itself on the first merge to main or shows the wrong diff. See
# "Project Workflow" in CLAUDE.md for why the shape is what it is.
#
# Every alias here pushes, so the user runs them: the SSH key is
# passphrase-protected and an agent cannot unlock it.

[aliases]

# Open the review. Freezes a base at the fork point and opens a draft PR against
# it, so merging the branch into main never closes the PR.
review-open = '''
set -e

# Both failure modes look identical in the refs -- a branch with no commits and a
# branch already merged into main are both "contained in main" -- so the message
# covers both rather than guessing.
refuse_empty() {
  echo "no commits on this branch that are not already in main." >&2
  echo "  new branch?  commit first: GitHub cannot open a pull request with no" >&2
  echo "               commits between base and head." >&2
  echo "  merged already?  the review diff would be empty; the review needed" >&2
  echo "               opening before the first deploy." >&2
  exit 1
}

# Checked against the local ref first, so this cannot fail after asking for the
# SSH passphrase.
if [ "$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)" = "0" ]; then
  refuse_empty
fi

git fetch -q origin main
base=$(git merge-base origin/main HEAD)
if [ "$base" = "$(git rev-parse HEAD)" ]; then
  refuse_empty
fi

git push -u origin {{ branch }}
git push origin "$base:refs/heads/review/{{ branch }}-base"
gh pr create --base "review/{{ branch }}-base" --head {{ branch }} --draft \
  --title "{{ branch }}" --body ""
'''

# Merge the branch into main so Flux deploys it. One way only: merging main back
# into the branch would drag Flux Bot's commits into the review diff.
deploy = '''
set -e

# Operate in whichever worktree already holds main rather than checking it out
# here. Switching was the old approach and it failed exactly when worktrees are
# in use, which is most of the time: git refuses a branch already checked out
# elsewhere, and the advice it gave - run deploy from there - would merge main
# into itself, because {{ branch }} is main in that worktree.
#
# Not switching also removes the reason the old version needed a trap. Nothing
# can strand this worktree on main if it never leaves its own branch.
main_worktree=$(git worktree list --porcelain |
  awk '/^worktree /{wt=substr($0,10)} /^branch refs\/heads\/main$/{print wt}')

if [ -z "$main_worktree" ]; then
  echo "main is not checked out in any worktree." >&2
  echo "check it out somewhere - usually the repo root - and deploy again." >&2
  exit 1
fi

# Flux Bot pushes to main between deploys, so the local main is routinely behind
# and the push below would be rejected. A merge rather than a rebase or a
# fast-forward: see the Project Workflow section of CLAUDE.md.
git -C "$main_worktree" pull --no-rebase --no-edit origin main

# Name the worktree on failure: the merge happens somewhere other than here, so
# a conflict leaves a directory the deployer is not standing in mid-merge.
if ! git -C "$main_worktree" merge --no-ff {{ branch }} -m "Merge {{ branch }} for cluster test."; then
  echo "conflict merging {{ branch }} into main, in $main_worktree" >&2
  echo "resolve it there. if the resolution changes this project's own work," >&2
  echo "commit the equivalent on {{ branch }} - see CLAUDE.md." >&2
  exit 1
fi

git -C "$main_worktree" push origin main
'''

# Complete the review. Merging into the frozen base marks the PR genuinely
# merged and leaves main untouched, because the code reached main incrementally
# long before. The base branch is then deleted: GitHub retains a merged pull
# request's diff and merge commit through its own refs, not through the branch,
# so nothing is lost. Measured on PR #4 - every file, commit and line count
# identical after deleting review/treefmt-base.
review-close = '''
set -e

# Closing deletes the branch, so the work has to be on main first. A project that
# touches nothing Flux deploys never needs `deploy` for testing, which is exactly
# when this is easy to forget and expensive to get wrong: the commits would
# survive only on the frozen review base.
# Checked against the local ref first so the ordinary case costs no passphrase.
if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
  git fetch -q origin main
  if ! git merge-base --is-ancestor HEAD origin/main; then
    echo "this branch is not contained in main - run wt deploy first." >&2
    echo "closing deletes the branch, and the work would survive only on the" >&2
    echo "frozen review base." >&2
    exit 1
  fi
fi

# Resolve before merging: --delete-branch removes the branch, which strands its
# worktree on the review base and loses the association with the project.
project_worktree=$(git worktree list --porcelain |
  awk -v b="branch refs/heads/{{ branch }}" '/^worktree /{wt=substr($0,10)} $0==b{print wt}')

# Drafts cannot be merged from the web UI; whether the API refuses one is not
# worth depending on either way, and closing the review is exactly the moment the
# work stops being a draft.
gh pr ready {{ branch }}
gh pr merge {{ branch }} --merge --delete-branch

# The base branch has done its job: it kept the pull request open across every
# deploy. Deleting it keeps the branch list from accruing one dead entry per
# project. Remote only - wt remove below deletes the local ref, which it grades
# as safe because merging the base into main adds nothing main does not have.
gh api -X DELETE "repos/{owner}/{repo}/git/refs/heads/review/{{ branch }}-base" --silent ||
  echo "could not delete review/{{ branch }}-base; remove it by hand." >&2

# Last, because removal renames the directory this alias may be running in, and
# because worktrunk switches to main's worktree afterwards. --foreground so the
# alias does not return while removal is still in flight.
#
# Only a linked worktree: git-dir differs from git-common-dir there, so a project
# worked on in the repo root - as this workflow itself was - is never removed.
#
# Reports rather than aborting. wt refuses a worktree holding uncommitted or
# untracked files, and by this point the review is closed either way, so a
# worktree worth keeping is not a failed close.
if [ -n "$project_worktree" ] &&
   [ "$(git -C "$project_worktree" rev-parse --git-dir)" \
     != "$(git -C "$project_worktree" rev-parse --git-common-dir)" ]; then
  wt remove --foreground "$project_worktree" ||
    echo "worktree kept: $project_worktree - remove it with wt remove -f once saved." >&2
fi
'''
