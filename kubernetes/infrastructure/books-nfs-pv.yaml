apiVersion: v1
kind: PersistentVolume
metadata:
  name: books-nfs-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi
  persistentVolumeReclaimPolicy: Retain
  # hard is the default, written out because soft is the tempting fix for a
  # stuck export and can corrupt writes. A stuck export hangs its pods instead.
  mountOptions:
    - nfsvers=4.2
    - hard
  # The hypervisor, by address: nodes resolve names through CoreDNS, which a
  # mount would then depend on.
  nfs:
    server: 192.168.0.111
    path: /rpool/storage/books
  volumeMode: Filesystem
