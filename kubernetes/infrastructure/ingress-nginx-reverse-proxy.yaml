---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ingress-nginx
spec:
  interval: 1h
  url: oci://registry.k8s.io/ingress-nginx/charts/ingress-nginx
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v4.12.8  # {"$imagepolicy": "infrastructure:ingress-nginx:tag"}

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ingress-nginx
spec:
  image: registry.k8s.io/ingress-nginx/charts/ingress-nginx
  interval: 1h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ingress-nginx
spec:
  imageRepositoryRef:
    name: ingress-nginx
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Held to the current minor until the upgrade to 4.15.x is verified, then
      # widened to '>=4.15.1 <5.0.0'.
      range: '>=4.12.8 <4.13.0'

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-internal
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ingress-nginx
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: ingress-nginx-internal
    controller:
      electionID: ingress-nginx-internal
      ingressClassResource:
        name: ingress-nginx-internal
        controllerValue: "k8s.io/ingress-nginx-internal"
        default: true
      ingressClass: ingress-nginx-internal
      metrics:
        enabled: true
        serviceMonitor:
          namespace: infrastructure
      podAnnotations:
        prometheus.io/scrape: true
        prometheus.io/port: 10254
      service:
        loadBalancerIP: "192.168.0.203"
    tcp:
      "64738": "apps/mumble:64738"
      "22000": "apps/syncthing:22000"
      "21027": "apps/syncthing:21027"
    udp:
      "64738": "apps/mumble:64738"
      "22000": "apps/syncthing:22000"

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-external
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ingress-nginx
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: ingress-nginx-external
    controller:
      electionID: ingress-nginx-external
      ingressClassResource:
        name: ingress-nginx-external
        controllerValue: "k8s.io/ingress-nginx-external"
        default: false
      ingressClass: ingress-nginx-external
      metrics:
        enabled: true
        serviceMonitor:
          namespace: infrastructure
      podAnnotations:
        prometheus.io/scrape: true
        prometheus.io/port: 10254
      service:
        loadBalancerIP: "192.168.0.201"
    tcp:
      "21027": "apps/syncthing:21027"
      "22000": "apps/syncthing:22000"
      "64738": "apps/mumble:64738"
    udp:
      "22000": "apps/syncthing:22000"
      "64738": "apps/mumble:64738"
