apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: soft-serve
spec:
  image: charmcli/soft-serve
  interval: 24h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: soft-serve
spec:
  imageRepositoryRef:
    name: soft-serve
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Pinned to the minor, not the major: Soft Serve is pre-1.0, where a
      # minor release may break, so crossing one is a decision.
      range: '>=0.12.2 <0.13.0'

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: soft-serve-python
spec:
  image: python
  interval: 24h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: soft-serve-python
spec:
  imageRepositoryRef:
    name: soft-serve-python
  filterTags:
    pattern: '^(?P<version>3\.[0-9]+\.[0-9]+)-alpine$'
    extract: '$version'
  policy:
    semver:
      # The plan script is stdlib only, so a minor Python release is no
      # boundary for it.
      range: '>=3.14.7 <4.0.0'
