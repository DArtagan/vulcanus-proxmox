apiVersion: apps/v1
kind: Deployment
metadata:
  name: automatic-ripping-machine
  labels:
    app: automatic-ripping-machine
spec:
  # The container claims `devic.es/cdrom: 1`, a node-level device resource with
  # a count of 1.  With the default RollingUpdate strategy, Kubernetes tries to
  # start the new pod before terminating the old one, but the new pod can never
  # schedule because the old pod still holds the cdrom device.  Recreate forces
  # the old pod to terminate first so the device is freed for the replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: automatic-ripping-machine
  template:
    metadata:
      labels:
        app: automatic-ripping-machine
    spec:
      initContainers:
        - name: config-injector
          image: bhgedigital/envsubst
          args: ["sh", "-c", 'cd source; for f in *; do cat "$f" | envsubst "$(printf ''${%s} '' $(env | cut -d''='' -f1))" > /destination/"$f"; done']
          envFrom:
            - secretRef:
                name: automatic-ripping-machine-api-keys
          volumeMounts:
            - mountPath: /source
              name: config
            - mountPath: /destination
              name: config-data
      containers:
        - name: automatic-ripping-machine
          image: automaticrippingmachine/automatic-ripping-machine:2.24.3 # {"$imagepolicy": "automatic-ripping-machine:automatic-ripping-machine"}
          env:
            - name: ARM_UID
              value: "0"
            - name: ARM_GID
              value: "0"
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          ports:
            - containerPort: 8080
          resources:
            # piraeus-worker-1 has 4 cores and 13Gi allocatable, and also carries
            # the flux-system control plane and both ingress controllers. The
            # memory limit stays below what the node can spare so an over-running
            # transcode dies as a container, with the OOM recorded against it:
            # Talos' node-level OOM controller kills whole pod cgroups instead,
            # taking unrelated workloads with it and leaving the job marked
            # 'transcoding' forever.
            # The request is sized to the encode rather than to the idle daemon.
            # SVT-AV1 at 1080p 10-bit reaches ~3Gi resident, and a pod running
            # far above its request is the first victim the OOM controller picks.
            # HandBrake gets three of the four cores; the fourth is left for
            # everything else on the node rather than being handed to a
            # transcode that will take whatever it is given.
            limits:
              devic.es/cdrom: 1
              cpu: 3000m
              memory: 8Gi
            requests:
              cpu: 500m
              memory: 4Gi
          volumeMounts:
            - mountPath: /etc/arm/config
              name: config-data
            # 'config-data` is the properly parsed source, also mount the plain `config` volume so that the pod restarts when it's updated
            - mountPath: /tmp/config
              name: config
            - mountPath: /lib/udev/rules.d/51-docker-arm.rules
              name: init-scripts
              subPath: 51-docker-arm.rules
            - mountPath: /usr/local/bin/arm-disc-wrapper.sh
              name: init-scripts
              subPath: arm-disc-wrapper.sh
            - mountPath: /usr/local/bin/arm-audio-handoff.sh
              name: init-scripts
              subPath: arm-audio-handoff.sh
            - mountPath: /usr/local/bin/arm-title-charset.sh
              name: init-scripts
              subPath: arm-title-charset.sh
            - mountPath: /usr/local/bin/arm-title-charset.py
              name: init-scripts
              subPath: arm-title-charset.py
            - mountPath: /etc/service/armui/run
              name: init-scripts
              subPath: armui.sh
            - mountPath: /etc/my_init.d/arm_user_files_setup.sh
              name: init-scripts
              subPath: arm_user_files_setup.sh
            - mountPath: /root/db
              name: data
              subPath: db
            - mountPath: /root/logs
              name: data
              subPath: logs
            - mountPath: /root/video
              name: video
              subPath: import/automatic-ripping-machine
            - mountPath: /root/audio
              name: audio
              subPath: import
      volumes:
        - name: audio
          persistentVolumeClaim:
            claimName: audio-rw-arm-pvc
        - name: config
          configMap:
            name: automatic-ripping-machine
        - name: config-data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: automatic-ripping-machine-init-scripts
            defaultMode: 0777
            items:
              - key: arm_user_files_setup.sh
                path: arm_user_files_setup.sh
              - key: 51-docker-arm.rules
                path: 51-docker-arm.rules
              - key: arm-disc-wrapper.sh
                path: arm-disc-wrapper.sh
              - key: arm-audio-handoff.sh
                path: arm-audio-handoff.sh
              - key: arm-title-charset.sh
                path: arm-title-charset.sh
              - key: arm-title-charset.py
                path: arm-title-charset.py
              - key: armui.sh
                path: armui.sh
        - name: data
          persistentVolumeClaim:
            claimName: automatic-ripping-machine-pvc
        - name: video
          persistentVolumeClaim:
            claimName: video-arm-pvc
