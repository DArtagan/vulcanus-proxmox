apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything here is in infrastructure, beside the repository Secret it reads.
# Each object names it: a `namespace:` transformer would also rewrite the
# ClusterRoleBinding's subject.
resources:
  - cron-job.yaml
  - healthchecks.sops.yaml
  - images.yaml
  - rbac.yaml
# From the file itself, so the deployed script is the one its tests run against,
# and a change rolls the CronJob onto a new ConfigMap.
configMapGenerator:
  - name: backup-coverage
    namespace: infrastructure
    files:
      - backup_coverage.py
