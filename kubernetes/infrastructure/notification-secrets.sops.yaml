# pushover-user-key   Your user key, from the top right of https://pushover.net
# pushover-token      Create an Application on that dashboard; this is its API token
#
# deadmans-switch-url
#                     A ping URL that alerts when pings STOP arriving, which is
#                     how a dead monitoring stack gets noticed. Uptime Robot puts
#                     heartbeat monitors behind a paid plan, so use
#                     https://healthchecks.io — the free Hobbyist tier covers 20
#                     checks and one is needed here.
#
#                     Create a check, take its https://hc-ping.com/<uuid> URL,
#                     and set Period to 15 minutes with a 5 minute grace.
#                     Alertmanager pings every 5 minutes, so that tolerates two
#                     missed deliveries before crying wolf.
#
#                     Add Pushover as its integration, so this alert arrives in
#                     the same place as everything else.
#
# Alertmanager reads these as files rather than inline values, so the routing
# config in prometheus.yaml stays readable in git while the credentials do not.
