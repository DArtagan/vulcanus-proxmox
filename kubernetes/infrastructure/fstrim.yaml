# Talos runs no fstrim timer and the machine.disks patch exposes a mountpoint
# with no mount options, so the `discard` mount option is out of reach and
# nothing in the guest ever returns freed blocks to ZFS. Left alone a zvol grows
# to its high-water mark and stays there: worker-0's reached 786 GB referenced
# against 122 GB of live data, and the nightly Proxmox backup dragged all of it
# off the platters on every full read.
#
# A hostPath reaches only the node its pod lands on, so this is one CronJob per
# node rather than one job carrying a list of hosts. They are otherwise
# identical, and staggered half an hour apart so no two ever trim the one pool at
# the same time.
#
# Each runs monthly, nowhere near 10:00 UTC when the Proxmox backup already
# saturates rpool, and during waking hours so a run that misbehaves is seen.
# worker-0's 1 TB volume takes about two minutes and lifts etcd's WAL fsync p99
# from 0.25 s to ~0.44 s; the others finish in seconds.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-worker-0
spec:
  schedule: "0 20 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: piraeus-worker-0
          containers:
            - name: fstrim
              image: alpine:3.22.2
              # FITRIM is the whole job, and it is the one thing an unprivileged
              # process cannot do. It does not need write access, though, so the
              # mounts below stay read-only — verified, not assumed.
              securityContext:
                capabilities:
                  add: ["SYS_ADMIN"]
              # -v prints the size of the range it *asked* the kernel to
              # discard, which is the whole volume every time and says nothing
              # about what was freed. Judge a run by `referenced` on the zvol,
              # from the host; see docs/talos.md.
              command:
                - sh
                - -euc
                - fstrim -v /host/var; fstrim -v /host/var/openebs
              volumeMounts:
                - name: var
                  mountPath: /host/var
                  readOnly: true
                - name: openebs
                  mountPath: /host/var/openebs
                  readOnly: true
          volumes:
            - name: var
              hostPath:
                path: /var
                type: Directory
            - name: openebs
              hostPath:
                path: /var/openebs
                type: Directory


---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-worker-1
spec:
  schedule: "30 20 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: piraeus-worker-1
          containers:
            - name: fstrim
              image: alpine:3.22.2
              securityContext:
                capabilities:
                  add: ["SYS_ADMIN"]
              command:
                - sh
                - -euc
                - fstrim -v /host/var; fstrim -v /host/var/openebs
              volumeMounts:
                - name: var
                  mountPath: /host/var
                  readOnly: true
                - name: openebs
                  mountPath: /host/var/openebs
                  readOnly: true
          volumes:
            - name: var
              hostPath:
                path: /var
                type: Directory
            - name: openebs
              hostPath:
                path: /var/openebs
                type: Directory


---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-control-plane-0
spec:
  schedule: "0 21 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          # No /var/openebs here: the control plane carries a single 10 GB disk
          # and runs no PVCs.
          nodeSelector:
            kubernetes.io/hostname: piraeus-control-plane-0
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          containers:
            - name: fstrim
              image: alpine:3.22.2
              securityContext:
                capabilities:
                  add: ["SYS_ADMIN"]
              command: ["fstrim", "-v", "/host/var"]
              volumeMounts:
                - name: var
                  mountPath: /host/var
                  readOnly: true
          volumes:
            - name: var
              hostPath:
                path: /var
                type: Directory
