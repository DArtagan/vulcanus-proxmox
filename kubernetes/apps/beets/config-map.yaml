kind: ConfigMap
apiVersion: v1
metadata:
  name: beets-config-map
data:
  # The one beets configuration, shared by both consumers:
  #
  #   * the beets-flask Deployment, which seeds it to /config/beets/config.yaml
  #     via the config-seed initContainer in deployment.yaml
  #   * the suspended beets-import CronJob, which projects it back to
  #     /config/config.yaml via `items:` on its ConfigMap volume
  #
  # Named config-beets.yaml rather than config.yaml only to distinguish it from
  # beets-flask-gui.yaml below; beets itself still sees it as config.yaml in
  # both cases.
  #
  # Several settings below exist because beets-flask is stricter than the CLI.
  # They are all harmless to the CronJob, so there is one file to maintain
  # rather than two that can drift.
  config-beets.yaml: |
    directory: /audio/
    library: /library/library.blb
    # No statefile: that is the CLI importer's resume state. beets-flask keeps
    # its own per-folder session state in its database, and sharing a pickle
    # between the two would only let them confuse each other.
    asciify_paths: yes
    # ORDER MATTERS. beets walks these in order and takes the first query that
    # matches, and `default` matches everything — so it has to come last.
    #
    # It was listed first until 2026-08-13, which made every rule below it
    # unreachable. No file has ever been routed by genre: the audiobooks
    # already under /audio/audiobooks/ were filed by an earlier config or by
    # hand, and newly imported audiobooks were landing in music/ no matter how
    # they were tagged.
    #
    # `genres`, not `genre`: the singular is deprecated in beets 2.11 and goes
    # away in 3.0, but more importantly only `genres` is in Album.item_keys.
    # `beet modify -a … genre=audiobook` sets an album field that never reaches
    # the items, and these queries are evaluated against items — so it would
    # appear to work and route nothing.
    #
    # Deliberately no `albumtypes:audiobook` rule. MusicBrainz's release-group
    # secondary type is a decent signal (35 albums) but a poorer one than our
    # own tagging (66 albums, of which MusicBrainz flags only 33), and two
    # fields deciding one thing is worse than one field doing it well. To find
    # audiobooks MusicBrainz knows about that we have not tagged:
    #     beet ls -a 'albumtypes:audiobook ^genres:audiobook'
    #
    # Audiobooks file under $author, not $albumartist. For an audiobook the
    # album artist is the whole MusicBrainz artist credit — author *and*
    # narrator — so one author scatters across a folder per narration. Brandon
    # Sanderson had seven. See item_fields below.
    #
    # $author is deliberately NOT used by %aunique. `aunique` builds a SQL
    # query through Album.duplicates_query, which cannot see computed fields,
    # so %aunique{author album} would silently disambiguate nothing. Left on
    # the default `albumartist album` keys, which still catches the common
    # case. The gap it leaves is two different narrations of the same title by
    # the same author: those now share one directory. There are none today.
    paths:
      genres:audiobook: audiobooks/$author/$album%aunique{}/$track $title
      genres:podcast: podcasts/$albumartist/$album%aunique{}/$track $title
      genres:christmas: christmas/$albumartist/$album%aunique{}/$track $title
      comp: music/Various Artists/$album%aunique{}/$track $title
      singleton: music/$artist/singles/$title
      default: music/$albumartist/$album%aunique{}/$track $title
    # Computed fields for the `inline` plugin. Top level, not nested under
    # `inline:` — the plugin reads config["item_fields"] from the root.
    #
    # `item_fields`, not `album_fields`: only item fields reach
    # Item._getters(), which is what Item.destination() formats a path
    # against. An album field would evaluate fine in `beet ls -a` and route
    # nothing, the same trap as `genre` vs `genres` above.
    #
    # Multi-line bodies are supported: inline tries to compile the text as an
    # expression first, fails, and falls back to a function body taking
    # `db_obj`.
    item_fields:
      # The author of an audiobook, in the order it can be trusted:
      #
      #   1. An explicit `author` flexible field, the manual escape hatch:
      #        beet modify 'album:Tanya' author='Carlo Zen'
      #      Read out of _values_flex directly because computed getters take
      #      precedence over flexible fields in Model._get, so `db_obj.author`
      #      would recurse into this function rather than find the override.
      #      Note it lives only in library.blb, which is not backed up, and is
      #      never written to file tags.
      #   2. albumartists[0]. MusicBrainz splits the credit into an ordered
      #      list with the author first. Populated for every MusicBrainz-
      #      matched album; the raw value is sometimes the literal string
      #      "[]", which is normalised here the same way audiobook_genre.py
      #      normalises albumtypes.
      #   3. albumartist split on the narrator separators, for the ~20 albums
      #      tagged from their filenames, where albumartists is empty.
      #   4. The credit string unchanged.
      #
      # Known limits, both pre-existing and both fixable with (1): a credit
      # that lists someone other than the author first (an illustrator, as on
      # the Tanya the Evil light novels) is taken at its word, and a
      # co-authored book files under its first author only.
      author: |
        import re
        override = db_obj._values_flex.get("author")
        if override:
            return override
        names = db_obj._get("albumartists") or []
        if isinstance(names, str):
            names = [] if names in ("", "[]") else [names]
        if names:
            return names[0]
        credited = db_obj._get("albumartist") or ""
        return re.split(
            r"\s*(?:,?\s*(?:read|narrated|performed)\s+by\s+|/)\s*",
            credited, maxsplit=1, flags=re.IGNORECASE,
        )[0].strip() or credited
    import:
      # beets-flask supports copy only — it types `move` as Literal[False], so
      # the `move: yes` this file used to carry is a hard validation error, not
      # a setting it quietly ignores. Consequence: imports no longer drain the
      # inbox. beets-flask has a `delete_imported_folders` action for that; if
      # the CronJob is ever unsuspended, it will leave the inbox in place too.
      move: no
      copy: yes
      # beets-flask's config schema defaults this to `remove`, which deletes
      # duplicates unattended. beets' own default is to ask. Set explicitly so
      # neither consumer can surprise us.
      duplicate_action: ask
    match:
      # The bar an unattended import must clear. Named explicitly because the
      # beets-flask inbox runs with autotag "auto" and auto_threshold null,
      # which falls back to this. 0.04 is the beets default, so it is the same
      # bar `beet import -q` was applying.
      strong_rec_thresh: 0.04
    # `clutter` and `ignore` do different jobs and are deliberately not the
    # same list.
    #
    # clutter: files that do not stop a *source* directory from counting as
    # empty, so it can be removed after a move. Inert while imports are copies,
    # since sources are never removed — it only matters if `move` returns.
    # cover.jpg belongs here and must NOT be in `ignore`: a leftover cover
    # should not block cleanup, but beets does need to see album art at import.
    # The first four entries replaced beets' own defaults rather than extending
    # them, so Thumbs.DB and .DS_Store are restored here.
    clutter: ["*.cue", "*.log", "*.m3u", "cover.jpg",
              "desktop.ini", "Icon.ico", "Thumbs.db", ".DS_Store"]
    # ignore: files beets skips when scanning the import directory. Also drives
    # the beets-flask inbox listing, whose gui.inbox.ignore falls back to this
    # list — desktop.ini and Icon.ico account for ~900 of the ~3,755 files the
    # inbox reports, being neither dotfiles nor matched by anything else.
    # *.log is here because the CronJob left import.log in the inbox root.
    ignore: [".*", "*~", "System Volume Information", "lost+found", "*.log",
             "desktop.ini", "Icon.ico", "Thumbs.db"]
    # Where audiobook_genre below is loaded from. Seeded by the config-seed
    # initContainer in deployment.yaml, same as the config files.
    pluginpath:
      - /config/beetsplug
    plugins:
      #- autobpm  # Can't figure out how to install librosa
      # Local plugin: sets genres=audiobook from MusicBrainz's albumtypes at
      # import time, so genre-based path routing does the rest. Keeps `genres`
      # the single field that decides placement while sparing us from tagging
      # by hand anything MusicBrainz already knows is an audiobook.
      - audiobook_genre
      - duplicates
      - fetchart
      - fromfilename
      - importadded
      - info
      - inline
      - lastgenre
      - mbsync
      - mbsubmit
      - missing
      - musicbrainz
      - replaygain
    # The `permissions` plugin is deliberately absent. Both consumers reach the
    # audio library over CIFS, which fixes file and directory modes as mount
    # options — so its chmod is a no-op at best and an EPERM per imported file
    # at worst.
    replaygain:
      # NOT gstreamer. The beets-flask image is python:3.12-slim carrying a
      # static ffmpeg and no GStreamer or PyGObject at all, so the gstreamer
      # backend aborts beets at startup. linuxserver/beets installs both
      # ffmpeg and gstreamer, so ffmpeg is equally fine for the CronJob.
      backend: ffmpeg
      # Analysis does not run during import. The beets-replaygain CronJob does
      # it instead; see replaygain-cron-job.yaml and docs/beets.md.
      #
      # beets-flask runs imports as rq jobs with a 600 second timeout
      # hardcoded in backend/beets_flask/redis.py, and ffmpeg analyses at
      # roughly 100x realtime. Any audiobook past about fifteen hours
      # therefore exceeds it and takes the entire import down with it.
      # Measured 2026-08-13: 14.9 h succeeded, 22.5 h raised
      # JobTimeoutException mid-import. The old CronJob never hit this because
      # a CronJob has no equivalent timeout.
      #
      # Throughput is the second reason. There is one import worker, so a long
      # audiobook would hold it for ten minutes or more; across the ~445 files
      # still in the inbox that is the difference between an evening and a
      # week.
      auto: no
    lastgenre:
      force: no
      # Seeded to this same absolute path in both containers, so one config
      # works for both.
      whitelist: /config/genre_whitelist.txt
      prefer_specific: true

  # A local beets plugin, seeded to /config/beetsplug/audiobook_genre.py and
  # picked up via the `pluginpath` setting above.
  #
  # Kept as a ConfigMap key rather than a file in the repo so that everything
  # the container reads at startup arrives by the same route, and so this stays
  # next to the config whose behaviour it completes.
  beets-flask-plugin-audiobook-genre.py: |
    """Prepend the audiobook genre when the release types say it is one.

    Registered on import_task_apply, which beets sends from the apply_choices
    stage — before manipulate_files. The genre is therefore already set when
    the destination path is computed, so an audiobook is written straight into
    audiobooks/ rather than landing in music/ and needing a second move.

    MusicBrainz supplies albumtypes. AlbumMatch.apply_metadata() copies
    album-level fields onto every item before this event fires, so the value is
    available by the time we look.

    Existing genres are preserved: audiobook is prepended, never substituted.
    """

    from beets.plugins import BeetsPlugin

    GENRE = "audiobook"


    def values(raw):
        """Normalise a beets multi-valued field to a list of non-empty strings.

        These are DelimitedString fields, so beets normally hands back a list —
        but an unset field arrives as None, and an empty albumtypes serialises
        to the literal "[]", which is the stored value on several thousand
        items in this library.

        The string branch is defensive; a parsed field should already be a
        list. It splits on both delimiters because the two fields do not share
        one: albumtypes stores "; " while genres stores "\␀", beets reserving
        "; " for template formatting since the backslash form breaks on
        Windows.
        """
        if not raw:
            return []
        if isinstance(raw, str):
            raw = raw.replace("\␀", ";").split(";")
        return [v for v in (str(x).strip() for x in raw) if v and v != "[]"]


    class AudiobookGenrePlugin(BeetsPlugin):
        def __init__(self):
            super().__init__()
            self.register_listener("import_task_apply", self.prepend_genre)

        def prepend_genre(self, session, task):
            for item in task.imported_items():
                if GENRE not in values(item.get("albumtypes")):
                    continue

                genres = values(item.get("genres"))
                if GENRE in genres:
                    continue

                item.genres = [GENRE] + genres
                self._log.info("prepended {0} genre: {1}", GENRE, item)

  # beets-flask's own settings — the web UI and container behaviour, not beets
  # itself. Seeded to /config/beets-flask/config.yaml. Read only at startup;
  # edits made through the web UI land on the PVC and are overwritten at the
  # next restart, so anything worth keeping belongs here, in git.
  beets-flask-gui.yaml: |
    gui:
      num_preview_workers: 4

      library:
        artist_separators: [",", ";", "&"]

      terminal:
        start_path: "/audio/import"

      inbox:
        # Seconds of filesystem quiet before autotagging fires, so an album
        # still being copied in is not tagged half-written.
        debounce_before_autotag: 30
        folders:
          Import:
            name: "Import"
            # The same directory the CronJob read as /media/audio/import: the
            # `media` share is /mnt/storage/media and `audio-rw` is
            # /mnt/storage/media/audio, so those two paths were always one
            # directory. beets-flask needs only the audio mount.
            #
            # This path must exist at startup — beets-flask fails config
            # validation and refuses to serve otherwise, which is how a failed
            # SMB mount will present.
            path: "/audio/import"
            # Fetch candidates and import anything clearing
            # match.strong_rec_thresh, reproducing what the nightly CronJob
            # did. Anything below the bar parks in the UI with its candidates
            # already fetched, instead of being dropped with a log line.
            autotag: "auto"
            # null means defer to match.strong_rec_thresh in the beets config.
            auto_threshold: null
