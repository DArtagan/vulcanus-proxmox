apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8up
spec:
  interval: 24h
  url: https://k8up-io.github.io/k8up

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
spec:
  interval: 15m
  chart:
    spec:
      chart: k8up
      # Bumped by hand: no OCI chart is published for the image automation to
      # follow. Chart and operator are versioned apart: 4.10.0 deploys v2.16.0.
      version: 4.10.0
      sourceRef:
        kind: HelmRepository
        name: k8up
      interval: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    k8up:
      # Safe only with one replica and the Recreate below, so never scale this
      # up. openebs.yaml does the same, for the same reason. See
      # docs/backups.md.
      enableLeaderElection: false
      envVars:
        # Empty turns off the Pushgateway push, whose default address reaches
        # nothing and logs an ERROR per item. Only here: an empty promURL on a
        # Schedule falls back to this. See docs/backups.md.
        - name: BACKUP_PROMURL
          value: ""
    metrics:
      # So TargetDown covers the operator. Coverage comes from the store, not
      # these metrics; see docs/backups.md.
      serviceMonitor:
        enabled: true
      # Its rules fire on a failed job, which cannot resolve itself. See
      # "alert on the absence of recent success" in docs/README.md.
      prometheusRule:
        enabled: false
  # The chart sets no strategy, so it would default to RollingUpdate and run two
  # operators through every upgrade with nothing electing between them. `add`,
  # since the rendered manifest has no strategy to replace.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: k8up
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
