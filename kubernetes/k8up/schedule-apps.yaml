apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: full
  namespace: apps
spec:
  backup:
    # UTC. Staggered against the other Schedules and the repository host's
    # jobs; see docs/backups.md.
    schedule: "0 1 * * *"
  # The repository's only K8up Check. See docs/backups.md.
  check:
    schedule: "0 3 * * 0"
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: dumps
  namespace: apps
spec:
  backup:
    # The label narrows this to the dumps. `full` takes them at 01:00.
    schedule: "0 7,13,19 * * *"
    labelSelectors:
      - matchLabels:
          k8up-dump: "true"
