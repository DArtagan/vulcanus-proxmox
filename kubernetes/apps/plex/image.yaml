apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: plex
spec:
  image: plexinc/pms-docker
  interval: 15m0s
  # The backup coverage check runs Plex's SQLite from this image.
  accessFrom:
    namespaceSelectors:
      - matchLabels:
          kubernetes.io/metadata.name: infrastructure


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: plex
spec:
  imageRepositoryRef:
    name: plex
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+-[0-9a-f]+$'
    extract: '$version'
  policy:
    semver:
      range: '^1.0.0'
