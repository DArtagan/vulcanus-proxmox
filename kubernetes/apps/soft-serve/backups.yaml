# A copy of Soft Serve's database, taken by a pod of our own: Soft Serve's image
# has no sqlite3. The repositories themselves ride the volume backup. See
# docs/backups.md.
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: soft-serve-sqlite
  labels:
    # Also picked up by the dumps-only Schedule.
    k8up-dump: "true"
spec:
  # .backup needs a seekable destination, hence the file before the cat.
  backupCommand: >-
    sh -c 'set -e; f=$(mktemp); trap "rm -f $f" EXIT;
    sqlite3 "/data/soft-serve.db" ".backup $f"; test -s "$f"; cat "$f"'
  fileExtension: .soft-serve.sqlite
  pod:
    spec:
      # The database's owner, so any -wal or -shm this pod creates stays
      # usable by soft-serve: its image runs as root.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: sqlite
          image: keinos/sqlite3:3.53.4 # {"$imagepolicy": "apps:k8up-sqlite3"}
          # Held open for K8up to exec into; tini passes on the stop signal.
          args: [tail, -f, /dev/null]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soft-serve-data-pvc
