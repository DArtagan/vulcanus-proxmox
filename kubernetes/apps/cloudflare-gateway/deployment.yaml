apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-gateway-profile
  labels:
    app: cloudflare-gateway-profile
spec:
  selector:
    matchLabels:
      app: cloudflare-gateway-profile
  template:
    metadata:
      labels:
        app: cloudflare-gateway-profile
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: profile-secret
              mountPath: /usr/share/nginx/html/adblock.mobileconfig
              subPath: adblock.mobileconfig
              readOnly: true
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
              readOnly: true
      volumes:
        - name: profile-secret
          secret:
            secretName: cloudflare-gateway-credentials
        - name: config
          configMap:
            name: cloudflare-gateway
