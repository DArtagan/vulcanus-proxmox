apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: borgmatic-data-pvc
  annotations:
    # borgmatic's cache and state, rebuilt from the repositories.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: openebs-hostpath
