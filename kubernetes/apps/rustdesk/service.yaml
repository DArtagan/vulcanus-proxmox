apiVersion: v1
kind: Service
metadata:
  name: rustdesk
spec:
  # Unlike the other apps, this is not fronted by ingress-nginx. hbbs hands the
  # source address it observes to the other peer as the hole-punch target, so
  # it has to see the real client IP — nginx would replace it with the
  # controller pod IP. Local keeps kube-proxy from SNATing it too.
  type: LoadBalancer
  loadBalancerIP: 192.168.0.204
  externalTrafficPolicy: Local
  selector:
    app: rustdesk
  ports:
    - name: hbbs-nat-test
      protocol: TCP
      port: 21115
    - name: hbbs-tcp
      protocol: TCP
      port: 21116
    - name: hbbs-udp
      protocol: UDP
      port: 21116
    - name: hbbr-relay
      protocol: TCP
      port: 21117
