# Reporting for the backup layer on the Proxmox host: sanoid pings a check when
# it succeeds, and two timers assert the state of a store -- the pool itself,
# and the PBS datastore -- rather than the exit code of a job that wrote it.
#
# The mini-nas half is in ~/repositories/mini-nas/modules/backup_monitoring.
# The two hosts are managed by different systems and cannot share files, so the
# shared scripts are duplicated and must be changed together. The PBS check has
# no counterpart there: PBS runs only on this host.
- name: 'report on the backup layer to healthchecks.io'
  hosts: proxmox

  vars:
    # sanoid on Debian splits the work across two units -- sanoid.service takes
    # snapshots and pulls in sanoid-prune.service, which prunes. NixOS runs a
    # single --cron service instead, which is why mini-nas hooks one unit and
    # this hooks two. The success ping goes on the prune unit because it is the
    # end of the chain; both get an OnFailure.
    sanoid_units:
      - sanoid
      - sanoid-prune

  tasks:
    - name: 'install jq for the pool-health check'
      apt:
        name: jq
        update_cache: yes

    - name: 'create the healthchecks URL directory'
      file:
        path: /etc/healthchecks
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: 'fail early if a URL is missing from .env'
      # Without this the files are written empty and every ping fails at
      # runtime, which surfaces as a red check rather than as the deployment
      # error it is.
      assert:
        that: "lookup('env', item) | length > 0"
        fail_msg: "{{ item }} is not set -- add it to .env before running this."
      loop:
        - HEALTHCHECK_SANOID_VULCANUS
        - HEALTHCHECK_POOL_HEALTH_VULCANUS
        - HEALTHCHECK_PBS_FRESHNESS

    - name: 'write the healthchecks URLs'
      copy:
        # A ping URL lets anyone mark the check received, so it is treated as a
        # credential: root-only, and sourced from .env rather than committed.
        content: "{{ item.value }}"
        dest: "/etc/healthchecks/{{ item.name }}"
        owner: root
        group: root
        mode: '0400'
      loop:
        - name: sanoid-vulcanus
          value: "{{ lookup('env', 'HEALTHCHECK_SANOID_VULCANUS') }}"
        - name: pool-health-vulcanus
          value: "{{ lookup('env', 'HEALTHCHECK_POOL_HEALTH_VULCANUS') }}"
        - name: pbs-freshness
          value: "{{ lookup('env', 'HEALTHCHECK_PBS_FRESHNESS') }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: 'install the ping helper'
      template:
        src: hc-ping.j2
        dest: /usr/local/bin/hc-ping
        owner: root
        group: root
        mode: '0755'

    - name: 'install the outcome reporter'
      template:
        src: hc-report.j2
        dest: /usr/local/bin/hc-report
        owner: root
        group: root
        mode: '0755'

    - name: 'install the pool-health check'
      template:
        src: zfs-pool-health.j2
        dest: /usr/local/bin/zfs-pool-health
        owner: root
        group: root
        mode: '0755'

    - name: 'install the PBS freshness check'
      copy:
        # copy rather than template: it takes no ansible variables, so the file
        # deployed is the file the tests in ansible/files/ run against.
        src: pbs_freshness.py
        dest: /usr/local/bin/pbs-freshness
        owner: root
        group: root
        mode: '0755'

    - name: 'create sanoid drop-in directories'
      file:
        path: "/etc/systemd/system/{{ item }}.service.d"
        state: directory
        mode: '0755'
      loop: "{{ sanoid_units }}"

    - name: 'report sanoid outcomes'
      copy:
        # ExecStopPost rather than ExecStartPost plus OnFailure: it runs once,
        # after the process has exited, and carries $SERVICE_RESULT, so the ping
        # reflects what actually happened rather than that the unit started.
        #
        # `-` because a backup that ran is not a backup that failed -- an
        # unreachable monitor must not mark the unit failed. A ping that does not
        # arrive turns the check red on its own period.
        #
        # Both units report to one check. Normally both succeed and send two
        # identical pings, which healthchecks treats as one receipt; a config
        # error fails both. The mixed case is rare enough not to design around.
        content: |
          [Service]
          ExecStopPost=-/usr/local/bin/hc-report sanoid-vulcanus
        dest: "/etc/systemd/system/{{ item }}.service.d/healthcheck.conf"
        mode: '0644'
      loop: "{{ sanoid_units }}"
      notify: reload systemd

    - name: 'install the pool-health service'
      copy:
        content: |
          [Unit]
          Description=Assert pool health, errors, capacity and scrub age

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/zfs-pool-health pool-health-vulcanus 80
        dest: /etc/systemd/system/zfs-pool-health.service
        mode: '0644'
      notify: reload systemd

    - name: 'install the pool-health timer'
      copy:
        content: |
          [Unit]
          Description=Hourly pool health assertion

          [Timer]
          OnCalendar=hourly
          RandomizedDelaySec=5m
          Persistent=true

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/zfs-pool-health.timer
        mode: '0644'
      notify: reload systemd

    - name: 'install the PBS freshness service'
      copy:
        content: |
          [Unit]
          Description=Assert PBS holds a current backup for every guest in scope

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/pbs-freshness pbs-freshness 26
        dest: /etc/systemd/system/pbs-freshness.service
        mode: '0644'
      notify: reload systemd

    - name: 'install the PBS freshness timer'
      copy:
        # 08:00 local, four hours after vzdump starts at 04:00. The margin is
        # the point: a guest whose backup has not landed yet reads as 26 h old
        # and fails, and the job has run 2h22m before now -- a recreated QEMU
        # dirty bitmap on 2026-08-19 -- against a 15-21 min norm.
        content: |
          [Unit]
          Description=Daily PBS coverage assertion

          [Timer]
          OnCalendar=*-*-* 08:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/pbs-freshness.timer
        mode: '0644'
      notify: reload systemd

    - name: 'remove the superseded ExecStartPost drop-ins'
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/sanoid-prune.service.d/healthcheck-success.conf
        - /etc/systemd/system/healthcheck-fail@.service
      notify: reload systemd

    - name: 'enable the assertion timers'
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop:
        - zfs-pool-health.timer
        - pbs-freshness.timer

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
