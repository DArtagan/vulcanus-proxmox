apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: rustdesk
spec:
  image: rustdesk/rustdesk-server
  interval: 15m0s


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: rustdesk
spec:
  imageRepositoryRef:
    name: rustdesk
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=1.1.0'
