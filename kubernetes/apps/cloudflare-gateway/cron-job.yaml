apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-gateway-sync
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  schedule: "30 10 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              image: ghcr.io/dartagan/cloudflare-gateway-pihole-scripts:20260101000000 # {"$imagepolicy": "apps:cloudflare-gateway-sync"}
              command: ["npm", "start", "--prefix", "/app/"]
              env:
                - name: CLOUDFLARE_LIST_ITEM_LIMIT
                  value: "300000"
              envFrom:
                - secretRef:
                    name: cloudflare-gateway-credentials
              volumeMounts:
                - name: allowlist
                  mountPath: /app/allowlist.txt
                  subPath: allowlist.txt
          restartPolicy: OnFailure
          volumes:
            - name: allowlist
              configMap:
                name: cloudflare-gateway
                items:
                  - key: allowlist.txt
                    path: allowlist.txt
