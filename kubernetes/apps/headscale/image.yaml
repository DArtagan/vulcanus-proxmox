apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: headscale
spec:
  image: headscale/headscale
  interval: 15m0s


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: headscale
spec:
  imageRepositoryRef:
    name: headscale
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Explicit bounds, because caret notation pins the minor on a 0.x version:
      # '^0.29.0' resolves to '>=0.29.0 <0.30.0'. A range that excludes a new
      # release has no visible symptom — Flux keeps scanning and keeps listing
      # the newer tags it is correctly not selecting.
      range: '>=0.29.0 <1.0.0'


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: headplane
spec:
  image: ghcr.io/tale/headplane
  interval: 15m0s


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: headplane
spec:
  imageRepositoryRef:
    name: headplane
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '^0.6.1'
