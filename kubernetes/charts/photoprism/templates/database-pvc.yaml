apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-database-pvc
  annotations:
    # Backed up by its dump instead.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.databaseSize }}
  storageClassName: openebs-hostpath
