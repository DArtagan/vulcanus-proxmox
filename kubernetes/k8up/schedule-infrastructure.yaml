apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: full
  namespace: infrastructure
spec:
  backup:
    # UTC. Staggered against the other Schedules and the repository host's
    # jobs; see docs/backups.md.
    schedule: "30 1 * * *"
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: dumps
  namespace: infrastructure
spec:
  backup:
    # The label narrows this to the dumps. `full` takes them at 01:30.
    schedule: "30 7,13,19 * * *"
    labelSelectors:
      - matchLabels:
          k8up-dump: "true"
