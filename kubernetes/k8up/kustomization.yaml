apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# A Schedule backs up the namespace it lives in, so each namespace has its own
# directory, setting its own `namespace:`.
resources:
  - apps
  - automatic-ripping-machine
  - coverage
  - image-update-automation.yaml
  - infrastructure
  - sqlite3-image.yaml
patches:
  - path: schedule-defaults.yaml
    target:
      kind: Schedule
