apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinepods-valkey-pvc
  annotations:
    # A cache. The durable state is in Postgres. See docs/backups.md.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: openebs-hostpath
