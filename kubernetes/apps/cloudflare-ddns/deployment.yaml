# Keeps the public DNS for immortalkeep.com pointed at a changing WAN IP. What
# depends on that, and why the zone is shaped the way it is, is in
# docs/network.md.
#
# This is a Deployment and must stay one. UPDATE_CRON=@once plus a */5 CronJob
# would appear to inherit CronJobNotSucceeding for free, but in @once mode the
# updater returns 0 unconditionally — a revoked token would log a Successful Job
# every five minutes forever, and the alert would be structurally blind.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  labels:
    app: cloudflare-ddns
spec:
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.1 # {"$imagepolicy": "apps:cloudflare-ddns"}
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns
                  key: CLOUDFLARE_API_TOKEN
            # Not the apex or the wildcard: those are CNAMEs, and the
            # updater creates whatever it cannot find rather than erroring, so
            # naming them lays A records over the chain. See docs/network.md.
            - name: DOMAINS
              value: "dynamic.immortalkeep.com"
            # The zone is unproxied by necessity, not preference — see
            # docs/network.md. Applies only to records the updater creates.
            - name: PROXIED
              value: "false"
            # The zone holds no AAAA records. Left enabled, the updater chases a
            # record family that does not exist and reports failures for it.
            - name: IP6_PROVIDER
              value: "none"
            - name: UPDATE_CRON
              value: "@every 5m"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
