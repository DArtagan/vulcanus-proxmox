# Read-only and cluster-wide, so a namespace no Schedule covers still counts.
# The logs are K8up backup pods', for restic's per-item error counts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-coverage
  namespace: infrastructure

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-coverage
rules:
  - apiGroups: ['']
    resources: ['persistentvolumeclaims', 'pods']
    verbs: ['list']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['list']
  - apiGroups: ['k8up.io']
    resources: ['prebackuppods']
    verbs: ['list']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-coverage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-coverage
subjects:
  - kind: ServiceAccount
    name: backup-coverage
    namespace: infrastructure
