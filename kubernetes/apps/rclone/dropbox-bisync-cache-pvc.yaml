apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rclone-dropbox-bisync-cache-pvc
  annotations:
    # rclone's bisync state, rebuilt by a resync. See docs/backups.md.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: openebs-hostpath
