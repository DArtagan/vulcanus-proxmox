apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns
spec:
  interval: 1h
  url: oci://ghcr.io/coredns/charts/coredns
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.47.0 # {"$imagepolicy": "infrastructure:coredns:tag"}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coredns
spec:
  image: ghcr.io/coredns/charts/coredns
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coredns
spec:
  imageRepositoryRef:
    name: coredns
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=1.47.0 <2.0.0'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: coredns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    isClusterService: false
    prometheus:
      service:
        enabled: true
    service:
      loadBalancerIP: "192.168.0.202"
    serviceType: LoadBalancer
    servers:
      - zones:
          - zone: .
            # Without this the chart renders a UDP port only. The live Service has
            # carried both udp-53 and tcp-53 since chart 1.29.0, and resolvers fall
            # back to TCP for responses that do not fit in a UDP datagram.
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: any
          - name: bufsize
            parameters: 1232
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
          - name: forward
            parameters: . tls://1.1.1.1
            configBlock: |-
              tls_servername cloudflare-dns.com
              health_check 5s
            # Hairpinning is not a concern: tailnet devices resolve immortalkeep.com
            # via Headscale split DNS → CoreDNS, infrastructure VMs use CoreDNS
            # directly, and LAN devices use CoreDNS via router DHCP (primary) with
            # Cloudflare (secondary) as fallback.
      - zones:
          - zone: immortalkeep.com
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: log
          - name: health
            configBlock: |-
              lameduck 5s
          - name: file
            parameters: /etc/coredns/db.immortalkeep.com
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: reload
      # status.immortalkeep.com is a Cloudflare DNS entry that redirects to
      # the Uptime Robot status page — it is not served by the internal
      # ingress. This zone is more specific than immortalkeep.com above, so
      # CoreDNS answers it via public DNS instead of falling through to the
      # wildcard record, which would otherwise point it at the internal
      # ingress (no rule there for this host). Covers LAN clients (CoreDNS
      # via router DHCP) and tailnet clients (CoreDNS via Headscale split
      # DNS) with one change.
      - zones:
          - zone: status.immortalkeep.com
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: forward
            parameters: . tls://1.1.1.1
            configBlock: |-
              tls_servername cloudflare-dns.com
              health_check 5s
    zoneFiles:
      - filename: db.immortalkeep.com
        domain: immortalkeep.com
        contents: |-
          $ORIGIN immortalkeep.com.
          $TTL 1h

          ; --- SOA & NS ---
          @                       IN  SOA  ns.immortalkeep.com. hostmaster.immortalkeep.com. (
                                               2026080701 ; serial (YYYYMMDDNN)
                                               86400      ; refresh (1d)
                                               7200       ; retry (2h)
                                               2419200    ; expire (4w)
                                               3600 )     ; negative cache TTL (1h)
          @                       IN  NS   ns.immortalkeep.com.

          ; --- Infrastructure hosts ---
          vulcanus                IN  A    192.168.0.111
          proxmox-backup-server   IN  A    192.168.0.107
          fileserver              IN  A    192.168.0.105
          ns                      IN  A    192.168.0.202  ; CoreDNS

          ; --- Kubernetes nodes ---
          piraeus-control-plane-0 IN  A    192.168.0.190
          piraeus-worker-0        IN  A    192.168.0.195
          piraeus-worker-1        IN  A    192.168.0.196
          piraeus-api             IN  A    192.168.0.200  ; cluster VIP

          ; --- Services with their own LoadBalancer IP ---
          ; Must be listed explicitly, otherwise the wildcard below sends them
          ; to the internal ingress, which does not serve their ports.
          rustdesk                IN  A    192.168.0.204
          mumble                  IN  A    192.168.0.205
          ; Sync traffic only. syncthing.immortalkeep.com is intentionally left
          ; to the wildcard so the web UI keeps reaching the ingress over TLS.
          syncthing-sync          IN  A    192.168.0.206

          ; --- Kubernetes services (via ingress) ---
          ; Wildcard routes all subdomains to internal ingress controller.
          ; Explicit records above take precedence over the wildcard.
          @                       IN  A    192.168.0.203
          *.immortalkeep.com.     IN  A    192.168.0.203

          ; --- MetalLB service IPs (for reference) ---
          ; 192.168.0.201 = ingress-nginx-external
          ; 192.168.0.202 = CoreDNS (this service)
          ; 192.168.0.203 = ingress-nginx-internal
          ; 192.168.0.204 = rustdesk (hbbs + hbbr)
          ; 192.168.0.205 = mumble (64738 tcp+udp)
          ; 192.168.0.206 = syncthing sync (22000 tcp+udp)
          ; Pool is 192.168.0.201-210, so 207-210 remain. Check the router's
          ; DHCP range before widening it.
          ;
          ; --- Router DHCP DNS settings ---
          ; Primary: 192.168.0.202 (CoreDNS)
          ; Secondary: 1.1.1.1 (Cloudflare, failover when CoreDNS/cluster is down)
