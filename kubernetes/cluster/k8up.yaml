apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8up
  namespace: flux-system
spec:
  # The CRDs come with the operator in infrastructure; the Schedules and their
  # Secrets land in namespaces the other two create.
  dependsOn:
    - name: infrastructure
    - name: apps
    - name: automatic-ripping-machine
  interval: 10m0s
  retryInterval: 1m0s
  path: ./kubernetes/k8up
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
