apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# In infrastructure, beside the repository Secret it reads.
namespace: infrastructure
resources:
  - cron-job.yaml
  - healthchecks.sops.yaml
  - images.yaml
  - rbac.yaml
# From the file itself, so the deployed script is the one its tests run against,
# and a change rolls the CronJob onto a new ConfigMap.
configMapGenerator:
  - name: backup-coverage
    files:
      - backup_coverage.py
