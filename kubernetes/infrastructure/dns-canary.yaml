# Proves that DNS filtering is actually happening. See docs/dns-filtering.md.
#
# Queries 192.168.0.202, the LoadBalancer address, rather than the in-cluster
# Service name: that is the path LAN and tailnet clients take, and a pod
# reaching it exercises MetalLB too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-canary
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      # Do not retry: a retry that succeeds hides the flap this exists to notice.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: busybox:1.37
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              env:
                - name: RESOLVER
                  value: "192.168.0.202"
                # Three ad networks, not one, and the run fails only if none of
                # them is blocked -- so a single domain leaving a blocklist
                # cannot blind the check, while filtering stopping entirely
                # still trips it. Each was verified blocked through Gateway
                # before being put here; verify any replacement the same way
                # rather than assuming, with:
                #   curl -H 'accept: application/dns-json' \
                #     "https://<sub>.cloudflare-gateway.com/dns-query?name=<d>&type=A"
                #
                # doubleclick.net was the original choice and was wrong: oisd
                # deliberately does not block the apex, because it breaks Google
                # services. The canary reported "filtering is not in effect" for
                # seventeen hours while filtering worked correctly.
                - name: BLOCKED_DOMAINS
                  value: "pagead2.googlesyndication.com ib.adnxs.com ads.pubmatic.com"
                # Must resolve. If this fails, DNS is broken rather than strict,
                # and the run says so instead of blaming the filter.
                - name: CONTROL_DOMAIN
                  value: "cloudflare.com"
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  # Addresses only, with the "Server:"/"Address: <ip>:53" header
                  # lines dropped. Parsing this way rather than matching busybox's
                  # label format, which differs between versions.
                  answers() {
                    nslookup "$1" "$2" 2>/dev/null \
                      | sed -n '/^Name:/,$p' \
                      | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' \
                      | sort -u | tr '\n' ' '
                  }

                  fail=0

                  ctrl=$(answers "$CONTROL_DOMAIN" "$RESOLVER")
                  case " $ctrl " in
                    *" 0.0.0.0 "*|"  ")
                      echo "FAIL: $CONTROL_DOMAIN did not resolve via $RESOLVER — DNS is down, not filtering."
                      fail=1 ;;
                    *) echo "ok: $CONTROL_DOMAIN -> $ctrl" ;;
                  esac

                  # Nothing routable means blocked. Do NOT rewrite this to
                  # compare against an unfiltered resolver and treat a difference
                  # as success: ad domains are geo-distributed and rotate, so
                  # that version passed while nothing was filtered at all.
                  blocked=0
                  leaked=""
                  for d in $BLOCKED_DOMAINS; do
                    got=$(answers "$d" "$RESOLVER")
                    routable=$(echo "$got" | tr ' ' '\n' | grep -vE '^(0\.0\.0\.0)?$' | tr '\n' ' ')
                    if [ -n "$routable" ]; then
                      leaked="$leaked $d"
                    else
                      blocked=$((blocked + 1))
                      echo "ok: $d blocked via $RESOLVER (answer: '${got:-NXDOMAIN}')"
                    fi
                  done

                  if [ "$blocked" -eq 0 ]; then
                    echo "FAIL: none of $BLOCKED_DOMAINS was blocked via $RESOLVER — filtering is not in effect."
                    fail=1
                  elif [ -n "$leaked" ]; then
                    # Not a failure: one list dropping a domain is ordinary. Said
                    # out loud so a slow drift toward zero is visible in the logs
                    # before it becomes an outage.
                    echo "note:$leaked resolved rather than blocked; $blocked of the set still blocked."
                  fi

                  exit $fail
