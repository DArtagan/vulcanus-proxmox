# Serves the Apple configuration profile that points a device's encrypted DNS at
# Cloudflare Gateway. This is the only way a family iPhone is covered when it is
# away from home — the router settings and CoreDNS reach nothing off-LAN — so it
# is the primary delivery mechanism for the whole project, not a convenience.
#
# nginx-unprivileged rather than nginx, listening on 8080 rather than 80. The
# pod runs as a non-root user with every capability dropped, and binding a port
# below 1024 needs CAP_NET_BIND_SERVICE. Stock nginx additionally writes its pid
# and temp paths under /var, which readOnlyRootFilesystem forbids; this image
# puts both under /tmp, which is why the emptyDir below is enough. The Service
# still publishes 80, so the Ingress is unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-gateway-profile
  labels:
    app: cloudflare-gateway-profile
spec:
  selector:
    matchLabels:
      app: cloudflare-gateway-profile
  template:
    metadata:
      labels:
        app: cloudflare-gateway-profile
    spec:
      securityContext:
        runAsNonRoot: true
        # 101 is the nginx user baked into the image; the writable mounts below
        # are chowned to it by fsGroup.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1-alpine
          ports:
            - name: http
              containerPort: 8080
          # Readiness only. A liveness probe would buy nothing here: nginx
          # serving three static files has no way to be alive but not serving,
          # and if the process dies the container exits and is restarted anyway.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: profile-secret
              mountPath: /usr/share/nginx/html/adblock.mobileconfig
              subPath: adblock.mobileconfig
              readOnly: true
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
              readOnly: true
            # Read by the sync CronJob over HTTP, not by any browser.
            - name: config
              mountPath: /usr/share/nginx/html/allowlist.txt
              subPath: allowlist.txt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Its own Secret, separate from the API credentials. The profile is a
        # build artefact rendered from adblock.mobileconfig.template by
        # tools/cloudflare-gateway/render-profile-secret.sh, so it is rewritten
        # whenever the Gateway location changes; the credentials are hand-managed
        # and should not be touched to do that. Keeping them apart also keeps the
        # sync CronJob's envFrom clean, since "adblock.mobileconfig" is not a
        # valid environment variable name.
        - name: profile-secret
          secret:
            secretName: cloudflare-gateway-mobileconfig
        - name: config
          configMap:
            name: cloudflare-gateway
        - name: tmp
          emptyDir: {}
