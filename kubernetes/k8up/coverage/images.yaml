# Updated by ../image-update-automation.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: backup-coverage-python
spec:
  image: python
  interval: 24h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: backup-coverage-python
spec:
  imageRepositoryRef:
    name: backup-coverage-python
  filterTags:
    pattern: '^(?P<version>3\.[0-9]+\.[0-9]+)-alpine$'
    extract: '$version'
  policy:
    semver:
      range: '>=3.14.7'

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: backup-coverage-restic
spec:
  image: restic/restic
  interval: 24h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: backup-coverage-restic
spec:
  imageRepositoryRef:
    name: backup-coverage-restic
  policy:
    semver:
      range: '>=0.19.1 <1.0.0'

---
# Follows Plex's own policy, through the apps ImageRepository.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: backup-coverage-plex
spec:
  imageRepositoryRef:
    name: plex
    namespace: apps
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+-[0-9a-f]+$'
    extract: '$version'
  policy:
    semver:
      range: '^1.0.0'
