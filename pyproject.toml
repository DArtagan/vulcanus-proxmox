# The Python this repository's tests and tools run on. There is no package,
# only the environment devenv builds with uv from this file and uv.lock.
[project]
name = "vulcanus-proxmox"
version = "0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
# ARM's patches are tested against the SQLAlchemy ARM runs, rather than a
# stand-in for it: ARM's container has 2.0.19, which predates wheels for this
# Python, so the bound is its minor version.
dev = [
  "pytest>=9.2.0",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.19,<2.1",
]

[tool.uv]
package = false
