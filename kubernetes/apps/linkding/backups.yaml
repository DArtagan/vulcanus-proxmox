# A copy of linkding's database, taken by a pod of our own: linkding's image has
# no sqlite3. tasks.sqlite3 beside it is the Huey task queue, and rides the volume
# backup.
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: linkding-sqlite
  labels:
    k8up-dump: "true"
spec:
  backupCommand: >-
    sh -c 'set -e; f=$(mktemp); trap "rm -f $f" EXIT; sqlite3 "/data/db.sqlite3" ".backup $f"; test -s "$f"; cat "$f"'
  fileExtension: .linkding.sqlite
  pod:
    spec:
      # The database's owner, so any -wal or -shm this pod creates stays
      # usable by linkding.
      securityContext:
        runAsUser: 33
        runAsGroup: 33
      containers:
        - name: sqlite
          image: keinos/sqlite3:3.54.1 # {"$imagepolicy": "apps:k8up-sqlite3"}
          # Held open for K8up to exec into; tini passes on the stop signal.
          args: [tail, -f, /dev/null]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
