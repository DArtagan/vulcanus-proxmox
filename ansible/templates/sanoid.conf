[rpool]
use_template = production
recursive = true

[rpool/ROOT]
use_template = dailies
recursive = true

[rpool/ROOT/pve-1]
use_template = dailies
recursive = true

[rpool/data]
use_template = dailies
recursive = true

[rpool/proxmox_backup_server]
use_template = dailies
recursive = true

[rpool/backups]
use_template = backups
recursive = true

# The restic repository keeps its own history, so its snapshots are for losing
# the repository itself. Dailies only, since each pins what restic's monthly
# prune rewrites. Overrides the recursive entry above.
[rpool/backups/restic]
use_template = dailies


[template_production]
frequently = 0
hourly = 36
daily = 30
monthly = 24
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes


[template_backups]
frequently = 0
hourly = 36
daily = 30
monthly = 12
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes


# A month of dailies and nothing else. sanoid.service runs with TZ=UTC, so the
# daily lands just after 00:00 UTC.
[template_dailies]
frequently = 0
hourly = 0
daily = 30
monthly = 0
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes
