apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-gateway
data:
  # Domains that must never be blocked. Add exceptions here, one plain domain
  # per line; they reach Cloudflare on the next run of each CronJob. Exempts
  # them from the filter lists and from the Security threats policy alike.
  # Served to the sync job over HTTP rather than mounted into it -- see
  # docs/dns-filtering.md for why mounting cannot work.
  allowlist.txt: |
    # Household exceptions. Upstream's recommended allowlists cover banks,
    # URL shorteners, Discord, Firefox sync and platform telemetry already.
    archive.today
    archive.ph
    archive.is
    archive.li
    archive.vn
    archive.md
    archive.fo
  # Reconciled into Cloudflare by the cloudflare-gateway-policy CronJob.
  ensure-security-policy.py: |
    """Reconcile the Gateway DNS policy that blocks Cloudflare's security categories.

    CGPS rewrites its own rule on every sync and will not carry this one, so it
    lives alongside as a second policy. Reconciling rather than creating once means
    a rule deleted in the dashboard comes back on the next run.

    Categories are policy selectors, not lists: this costs none of the account's
    300,000 list entries, which is why it replaces a threat-intelligence blocklist
    rather than sitting beside one.

    Anonymizer (68) is deliberately absent from an otherwise complete set of the
    free Security threats subcategories -- it blocks VPN, Tor and proxy sites, which
    are wanted here.

    The household allowlist is carved out of the rule, so one file holds every
    exception. Only that file: upstream's recommended allowlists include URL
    shorteners, which must stay subject to the Phishing category.
    """
    import json
    import os
    import re
    import sys
    import urllib.error
    import urllib.request

    API = "https://api.cloudflare.com/client/v4"
    NAME = "Security threats"
    CATEGORIES = [
        80,   # Command and Control & Botnet
        83,   # Cryptomining
        117,  # Malware
        131,  # Phishing
        134,  # Private IP Address
        151,  # Spam
        153,  # Spyware
        175,  # DNS Tunneling
        176,  # DGA Domains
        178,  # Brand Embedding
        187,  # Compromised Domain
        188,  # Potentially Unwanted Software
        191,  # Scam
    ]
    ALLOWLIST = "/app/allowlist.txt"
    DOMAIN = re.compile(r"^[a-z0-9-]+(\.[a-z0-9-]+)+$")


    def allowed_domains(text):
        domains = set()
        for line in text.splitlines():
            line = line.strip().lower()
            if not line or line.startswith("#"):
                continue
            # Spliced into the filter expression below, where anything but a
            # plain domain would change what the rule matches.
            if not DOMAIN.match(line):
                raise ValueError("not a plain domain in the allowlist: %r" % line)
            domains.add(line)
        return sorted(domains)


    def traffic(exceptions):
        expression = "any(dns.security_category[*] in {%s})" % " ".join(str(c) for c in CATEGORIES)
        if exceptions:
            # dns.domains carries the queried name and each of its parents, so
            # an entry covers its subdomains too.
            expression += ' and not(any(dns.domains[*] in {%s}))' % " ".join('"%s"' % d for d in exceptions)
        return expression


    def http(method, url, token, body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("Authorization", "Bearer %s" % token)
        req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=60) as r:
                return json.load(r)
        except urllib.error.HTTPError as e:
            try:
                return json.load(e)
            except Exception:
                return {"success": False, "errors": [{"message": "HTTP %s" % e.code}]}


    def fail(resp, what):
        print("FAIL: %s" % what)
        for e in resp.get("errors") or []:
            print("  %s %s" % (e.get("code", ""), e.get("message", "")))
        sys.exit(1)


    def main(request=None, allowlist=ALLOWLIST):
        request = request or http
        with open(allowlist) as f:
            exceptions = allowed_domains(f.read())
        token = os.environ["CLOUDFLARE_API_TOKEN"]
        account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
        base = "%s/accounts/%s/gateway/rules" % (API, account)

        desired = {
            "name": NAME,
            "description": "Cloudflare's own threat intelligence. Managed by cloudflare-gateway-policy.",
            "action": "block",
            "enabled": True,
            "filters": ["dns"],
            "traffic": traffic(exceptions),
        }

        listing = request("GET", base, token)
        if not listing.get("success"):
            fail(listing, "could not list DNS policies")

        mine = [r for r in (listing.get("result") or []) if r.get("name") == NAME]

        if not mine:
            resp = request("POST", base, token, desired)
            if not resp.get("success"):
                fail(resp, "could not create the policy")
            print("created %r blocking %d categories, %d exceptions" % (NAME, len(CATEGORIES), len(exceptions)))
            return 0

        current = mine[0]
        drift = [
            k for k in ("traffic", "action", "enabled")
            if current.get(k) != desired[k]
        ]
        if not drift:
            print("%r already correct: %d categories, %d exceptions, enabled" % (NAME, len(CATEGORIES), len(exceptions)))
            return 0

        resp = request("PUT", "%s/%s" % (base, current["id"]), token, desired)
        if not resp.get("success"):
            fail(resp, "could not update the policy")
        print("updated %r (drifted: %s)" % (NAME, ", ".join(drift)))
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  nginx-default.conf: |
    server {
        # 8080, not 80: the pod runs unprivileged. See deployment.yaml.
        listen 8080;
        root /usr/share/nginx/html;

        # Load-bearing: iOS decides whether to offer a profile from the
        # Content-Type alone, and nginx's stock mime.types has no entry for
        # .mobileconfig. Without this the hand-off to Settings never triggers.
        types {
            text/html                            html;
            application/x-apple-aspen-config     mobileconfig;
        }

        location / {
            index index.html;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Ad-Blocking DNS</title>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          max-width: 580px;
          margin: 60px auto;
          padding: 0 24px;
          color: #1a1a1a;
          line-height: 1.6;
        }
        h1 { font-size: 1.6rem; margin-bottom: 0.4rem; }
        .btn {
          display: inline-block;
          background: #f48120;
          color: white;
          padding: 14px 28px;
          text-decoration: none;
          border-radius: 8px;
          font-size: 1rem;
          font-weight: 600;
          margin-top: 20px;
        }
        hr { border: none; border-top: 1px solid #e5e5e5; margin: 32px 0; }
        small { color: #666; }
      </style>
    </head>
    <body>
      <h1>Ad-Blocking DNS</h1>
      <p>
        Install this DNS profile to block ads, trackers, and malware on this
        device — including in apps, not just in the browser.
      </p>
      <p>
        Works on <strong>iOS</strong> and <strong>macOS</strong>. After installing,
        open <strong>Settings &rarr; General &rarr; VPN &amp; Device Management</strong>
        and tap the profile to finish activating it.
      </p>
      <a class="btn" href="/adblock.mobileconfig">Download DNS Profile</a>
      <hr>
      <p>
        <small>
          Powered by <a href="https://www.cloudflare.com/products/zero-trust/gateway/">Cloudflare Gateway</a>.
          If you need to log in to a captive portal (hotel or airplane WiFi),
          go to <strong>Settings &rarr; General &rarr; VPN &amp; Device Management &rarr; DNS</strong>
          and temporarily switch to <strong>Automatic</strong>, then switch back when done.
        </small>
      </p>
    </body>
    </html>
