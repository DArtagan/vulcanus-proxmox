kind: ConfigMap
apiVersion: v1
metadata:
  name: automatic-ripping-machine-init-scripts
data:
  arm_user_files_setup.sh: |
    #!/bin/bash
    # This script is first to run due to this: https://github.com/phusion/baseimage-docker#running_startup_scripts.
    set -euo pipefail

    export ARM_HOME="/root"

    echo "Adding users to 'render' group"
    usermod -a -G render arm
    usermod -a -G render root

    ### Setup Files

    touch /root/logs/arm.log
    mkdir -m 777 /home/arm/logs
    ln -s /root/logs/arm.log /home/arm/logs/arm.log

    # setup needed/expected dirs if not found
    SUBDIRS="video/completed video/raw video/transcode logs/progress .MakeMKV"
    for dir in $SUBDIRS ; do
        thisDir="$ARM_HOME/$dir"
        if [[ ! -d "$thisDir" ]] ; then
            echo "Creating dir: $thisDir"
            mkdir -p "$thisDir"
        fi
    done

    # Where abcde writes a CD rip before arm-audio-handoff.sh moves it into the
    # inbox. Container-local and ephemeral: anything still here after a restart
    # is a rip that died before handing over, and re-inserting the disc is the
    # recovery.
    mkdir -p /home/arm/arm-incoming

    ln -s /root/.MakeMKV/ /home/arm/.MakeMKV

    # Patch fix_job_title so ARM cannot build a path this fileserver refuses to
    # write. Deliberately not fatal: a failure here costs TV discs with a
    # non-Latin-1 year, and it logs loudly, but it should not stop ARM starting.
    /usr/local/bin/arm-title-charset.sh || \
        echo "WARNING: arm-title-charset.sh failed; see /home/arm/logs/arm.log"

    # Edit ARM's source where the fix is a line rather than a wrapper. Not fatal
    # for the same reason as above: each edit that cannot apply logs and is
    # skipped, and the rest still go in.
    python3 /usr/local/bin/arm-source-patches.py || \
        echo "WARNING: arm-source-patches.py failed; see /home/arm/logs/arm.log"

    # abcde.conf is expected in /etc by the abcde installation
    cp --no-clobber /opt/arm/setup/.abcde.conf /etc/arm/config/abcde.conf
    mkdir -p /etc/root/config/
    ln -sf /etc/arm/config/abcde.conf /etc/root/config/abcde.conf

  51-docker-arm.rules: |
    ACTION=="change", SUBSYSTEM=="block", KERNEL=="sr[0-9]*", RUN+="/usr/local/bin/arm-disc-wrapper.sh %k"

  arm-disc-wrapper.sh: |
    #!/bin/bash
    # Gatekeeper called by udev on any block device change event. Two things
    # must be true before starting ARM:
    #
    #   1. A disc is present with the tray closed (CDROM_DRIVE_STATUS ==
    #      CDS_DISC_OK). Without this the eject event, which the container does
    #      receive, triggers a rip attempt against an empty drive.
    #   2. udev has published at least one ID_CDROM_MEDIA_* property for the
    #      device. Job.parse_udev() derives disctype from those alone, and the
    #      drive answers CDS_DISC_OK before its TOC has been read — so ARM
    #      started on the first of the events an insert generates fails with
    #      "Could not determine disc type" and leaves the drive holding that
    #      job, which blocks every later insert until someone abandons it by
    #      hand.
    #
    # Match ID_CDROM_MEDIA_ and not bare ID_CDROM_. The latter (ID_CDROM_BD,
    # ID_CDROM_DVD, ...) reports what the drive is capable of reading and is
    # present with the tray open.
    set -u

    DEVNAME="$1"
    DEV="/dev/${DEVNAME}"
    ARMLOG="/home/arm/logs/arm.log"

    # The drive needs a few seconds to read the TOC, longer for a Blu-ray than
    # for a CD.
    MEDIA_TIMEOUT=60
    MEDIA_INTERVAL=2

    log() {
        echo "$(date) [ARM] disc-wrapper: $*" >> "${ARMLOG}"
    }

    # One insert generates several change events, and an ATA link reset during a
    # rip generates more. The lock is inherited through the exec below, so it is
    # held for the life of the job and only the first event gets one.
    exec 9>"/run/lock/arm-disc-${DEVNAME}.lock"
    if ! flock -n 9; then
        log "a job already holds ${DEV}, skipping"
        exit 0
    fi

    STATUS=$(python3 -c "
    import fcntl, os
    try:
        fd = os.open('${DEV}', os.O_RDONLY | os.O_NONBLOCK)
        s = fcntl.ioctl(fd, 0x5326, 0)  # CDROM_DRIVE_STATUS
        os.close(fd)
        print(s)
    except Exception:
        print(0)
    " 2>/dev/null)

    # CDS_DISC_OK=4: disc present and tray closed. Anything else, skip.
    if [ "${STATUS}" != "4" ]; then
        log "no disc in ${DEV} (status=${STATUS}), skipping"
        exit 0
    fi

    waited=0
    until udevadm info "${DEV}" 2>/dev/null | grep -q "ID_CDROM_MEDIA_"; do
        if [ "${waited}" -ge "${MEDIA_TIMEOUT}" ]; then
            log "udev published no ID_CDROM_MEDIA_* for ${DEV} after ${MEDIA_TIMEOUT}s, skipping"
            exit 0
        fi
        sleep "${MEDIA_INTERVAL}"
        waited=$(( waited + MEDIA_INTERVAL ))
    done

    # udev starts this with no HOME, and makemkvcon finds its registration key
    # through $HOME/.MakeMKV. Without it MakeMKV runs unregistered and, once its
    # version has expired, refuses every disc with "This application version is
    # too old". ARM runs the job as root and writes the key to /root/.MakeMKV.
    export HOME=/root
    exec /opt/arm/scripts/docker/docker_arm_wrapper.sh "${DEVNAME}"

  arm-audio-handoff.sh: |
    #!/bin/bash
    # Moves a finished CD rip from container-local staging into the beets-flask
    # inbox, in a way that never shows a partial album.
    #
    # abcde encodes each track straight to its output directory, and
    # beets-flask enqueues an album 30s after it stops changing. Those gaps fall
    # *between tracks*, so pointing abcde at the inbox means it always sees a
    # partial album: on 2026-08-26 it built a session against a one-track folder
    # and never re-enqueued, leaving ten tracks on disk and nothing in the
    # library.
    #
    # Staging is container-local rather than a second mount of the audio share,
    # so ARM keeps write access to `import/` alone and nothing else.
    #
    # Invisibility during the copy uses two independent properties of
    # beets-flask, because either alone is a single point of failure:
    #   * its watchdog drops any event whose basename starts with "."
    #   * a file counts as audio only when its *name* ends in an audio extension
    # so tracks land as `.<name>.part` and are renamed only once all of them
    # have arrived. A dotted *directory* is not sufficient — measured with a
    # matched control on 2026-08-26, beets-flask enqueued dotted and undotted
    # probes identically.
    #
    # ARM calls this for every notification (utils.bash_notify) with
    # $1=title $2=body, because there is no completion hook: abcde's
    # do_postprocess is commented out and ARM has no per-stage callback. Hence
    # the message match.
    set -u

    BODY="${2:-}"

    STAGING="/home/arm/arm-incoming"
    INBOX="/root/audio"
    ARMLOG="/home/arm/logs/arm.log"

    log() {
        echo "$(date) [ARM] audio-handoff: $*" >> "${ARMLOG}"
    }

    # utils.py builds this as f"Music CD: {job.title} {PROCESS_COMPLETE}".
    # Matching the failure messages too would hand off a half-ripped album.
    case "${BODY}" in
        "Music CD: "*"processing complete."*) ;;
        *) exit 0 ;;
    esac

    [ -d "${STAGING}" ] || { log "nothing staged at ${STAGING}"; exit 0; }

    shopt -s nullglob
    for album in "${STAGING}"/*/; do
        album="${album%/}"
        name="$(basename "${album}")"
        dest="${INBOX}/${name}"

        # Two discs can land on the same name, and it is not a corner case:
        # every disc MusicBrainz cannot identify is called
        # "Unknown Artist Unknown Album". Disambiguate rather than refuse.
        #
        # Refusing and leaving the album in staging looks safer and is not.
        # Staging is container-local, so a retained album dies at the next pod
        # restart; and abcde writes the *next* rip into the same directory, so
        # an 8-track disc landing on a retained 11-track one leaves tracks 1-8
        # from the new disc and 9-11 from the old. That album looks complete and
        # is two discs.
        suffix=2
        while [ -e "${dest}" ]; do
            dest="${INBOX}/${name} (${suffix})"
            suffix=$(( suffix + 1 ))
        done

        mkdir -p "${dest}"
        failed=0
        for src in "${album}"/*; do
            [ -f "${src}" ] || continue
            base="$(basename "${src}")"
            if ! cp "${src}" "${dest}/.${base}.part"; then
                log "copy failed for ${base}"
                failed=1
                break
            fi
        done

        if [ "${failed}" -ne 0 ]; then
            # Leave nothing in the inbox that could be read as an album, and
            # keep the rip rather than discarding it. Move it aside under a name
            # abcde will not rip into: this is the only path that keeps staging,
            # so it is the only remaining way the next disc could merge into an
            # existing album.
            rm -f "${dest}"/.*.part
            rmdir "${dest}" 2>/dev/null
            kept="${album}.failed-$(date +%s)"
            mv "${album}" "${kept}"
            log "aborted ${name}; rip kept at ${kept}, and it will not survive a pod restart"
            continue
        fi

        # Reveal. Each rename is within one directory, so the album goes from
        # invisible to complete in a few milliseconds.
        for tmp in "${dest}"/.*.part; do
            base="$(basename "${tmp}")"
            base="${base#.}"
            base="${base%.part}"
            mv "${tmp}" "${dest}/${base}"
        done

        log "handed off ${name} to ${dest}"
        # Always, so the next rip cannot merge into what is left here.
        rm -rf "${album}"
    done

  arm-title-charset.sh: |
    #!/bin/bash
    # Makes ARM's output paths writable on this fileserver.
    #
    # Samba runs `unix charset = ISO-8859-1`, so creating any name containing a
    # character above U+00FF fails with EIO on every share. Job 20 died on
    # `.../tv/The-Sylvester-and-Tweety-Mysteries (1995-2002)` -- with an en dash --
    # because OMDb returns a series' year range that way. The real fix is a charset
    # migration; see todos/smb-charset-utf8.md, which explains why it is a migration
    # and not a one-line config change. This is the workaround that keeps ripping.
    #
    # ARM's own clean_for_filename does not cover it. It is applied to titles only
    # (identify.py:141, :274) while the en dash arrives through job.year, which
    # fix_job_title interpolates raw -- and it strips rather than replaces, turning
    # a year range into a single meaningless number.
    #
    # The patch body lives in arm-title-charset.py because a heredoc of top-level
    # Python cannot be indented inside a YAML block scalar without breaking one or
    # the other.
    set -u

    UTILS="/opt/arm/arm/ripper/utils.py"
    PATCH="/usr/local/bin/arm-title-charset.py"
    ARMLOG="/home/arm/logs/arm.log"
    MARKER="_arm_charset_patch"

    log() {
        echo "$(date) [ARM] title-charset: $*" >> "${ARMLOG}"
    }

    if grep -q "${MARKER}" "${UTILS}" 2>/dev/null; then
        exit 0
    fi

    # ARM auto-updates now, so a release that renames or moves this function must
    # not fail quietly: the symptom would be a TV rip dying on EIO again with
    # nothing pointing back here.
    if ! grep -q "^def fix_job_title" "${UTILS}" 2>/dev/null; then
        log "cannot patch ${UTILS}: no 'def fix_job_title' found."
        log "  TV discs with a non-Latin-1 year will fail with EIO until this is fixed."
        exit 1
    fi

    cat "${PATCH}" >> "${UTILS}"
    log "patched fix_job_title in ${UTILS} for the ISO-8859-1 fileserver"

  arm-title-charset.py: |
    # --- _arm_charset_patch, appended by arm-title-charset.sh -------------------
    # The fileserver's Samba runs `unix charset = ISO-8859-1`, so a path holding any
    # character above U+00FF cannot be written and fails with EIO. Map the
    # punctuation metadata providers actually emit, then drop whatever has no
    # Latin-1 form. Latin-1 rather than ASCII on purpose: the share accepts it, and
    # `Mànran` is already in the library under a Latin-1 name.
    #
    # Wrapping rather than editing fix_job_title's body, because every call site
    # resolves the name at call time -- `utils.fix_job_title(...)` in arm_ripper.py
    # and the bare name inside `move_files` -- so rebinding the module global
    # reaches both without depending on the function's internals.
    import unicodedata as _arm_ud  # noqa: E402

    _arm_charset_map = {
        0x2010: "-", 0x2011: "-", 0x2012: "-", 0x2013: "-", 0x2014: "-", 0x2015: "-",
        0x2018: "'", 0x2019: "'", 0x201A: "'", 0x201B: "'",
        0x201C: '"', 0x201D: '"', 0x201E: '"',
        0x2026: "...", 0x2032: "'", 0x2033: '"', 0x00A0: " ",
    }


    def _arm_charset_patch(text):
        text = str(text).translate(_arm_charset_map)
        out = []
        for ch in text:
            if ord(ch) < 0x100:
                out.append(ch)
                continue
            # NFKD first, so an accented character keeps its base letter rather than
            # vanishing entirely; then drop what still has no Latin-1 form.
            out.append("".join(c for c in _arm_ud.normalize("NFKD", ch) if ord(c) < 0x100))
        return "".join(out)


    _arm_charset_orig_fix_job_title = fix_job_title


    def fix_job_title(job):
        return _arm_charset_patch(_arm_charset_orig_fix_job_title(job))

  arm-source-patches.py: |
    """Edits to ARM's source, applied at container start.

    Each edit replaces text that must occur exactly once. ARM auto-updates, so
    an edit whose text has moved is skipped and logged rather than guessed at;
    the symptom would otherwise be the old behaviour returning with nothing
    pointing back here. Edits carry a marker, so a container restart, which keeps
    the already-patched files, re-applies nothing.
    """
    import datetime
    import sys

    RIPPER = "/opt/arm/arm/ripper"
    ARMLOG = "/home/arm/logs/arm.log"

    # Whole functions, appended so that they resolve the module's own globals as
    # ARM's code does. Applied before EDITS, which call them.
    APPENDS = [
        ("whole-disc-code", f"{RIPPER}/makemkv.py", "/usr/local/bin/arm-whole-disc.py"),
    ]

    EDITS = [
        (
            # The disc stays in the drive until the job is complete, transcode
            # included; main.py's finally: block ejects it. Without this edit the
            # tray opens as soon as the rip ends, which reads as "done" while the
            # transcode still holds the drive. See todos/disc-ripping.md, D8.
            "eject-after-processing",
            f"{RIPPER}/makemkv.py",
            '    job.eject()\n'
            '    logging.info(f"Exiting MakeMKV processing with return value of: {rawpath}")\n',
            '    # _arm_source_patch eject-after-processing: main.py ejects when the job ends\n'
            '    logging.info(f"Exiting MakeMKV processing with return value of: {rawpath}")\n',
        ),
        (
            # On the DVD path every title is registered twice: by MakeMKV numbered
            # from 0, and by HandBrake's scan numbered from 1. Only HandBrake's
            # numbers mean anything to `-t`. Encoding both sets runs `-t 0` (scan
            # all, writes nothing) and then encodes every title twice into the same
            # files. See todos/disc-ripping.md, D14.
            "d14-encode",
            f"{RIPPER}/handbrake.py",
            '    for track in job.tracks:\n'
            '        # Don\'t raise error if we past max titles',
            '    for track in job.tracks.filter_by(source="HandBrake"):  # _arm_source_patch d14-encode\n'
            '        # Don\'t raise error if we past max titles',
        ),
        (
            # The series branch moves each track by its filename. With d14-encode in
            # place MakeMKV's tracks keep their raw names, which find_matching_file
            # fuzzy-matches onto the transcodes (`C3_t01` scores as `title_1`) and
            # moves under the wrong name. Movies are left alone: their first
            # MakeMKV track routes them to skip_transcode_movie, which picks the
            # main feature by file size from the directory listing.
            "d14-move-series",
            f"{RIPPER}/arm_ripper.py",
            '    if job.video_type == "series":\n'
            '        for track in tracks:\n',
            '    if job.video_type == "series":\n'
            '        # _arm_source_patch d14-move-series: only HandBrake\'s tracks name files it wrote\n'
            '        if tracks.filter_by(source="HandBrake").count():\n'
            '            tracks = tracks.filter_by(source="HandBrake")\n'
            '        for track in tracks:\n',
        ),
        (
            # ARM backs up the whole disc only for a Blu-ray, and a DVD's raw copy
            # is otherwise its long titles alone. This stamps the raw folder with
            # its job, backs a DVD up whole, and fails the job on a backup that is
            # short. See todos/disc-ripping.md, phase 2c, D16 and D17.
            "whole-disc-route",
            f"{RIPPER}/makemkv.py",
            '    logging.info(f"Processing files to: {rawpath}")\n'
            '    # Rip BluRay\n'
            '    if (job.config.RIPMETHOD in ("backup", "backup_dvd")) and job.disctype == "bluray":\n'
            '        makemkv_backup(job, rawpath)\n'
            '    # Rip BluRay or DVD\n',
            '    logging.info(f"Processing files to: {rawpath}")\n'
            '    # _arm_source_patch whole-disc-route: stamp the folder, back up a DVD whole, check the backup\n'
            '    _arm_write_stamp(job, rawpath)\n'
            '    # Rip BluRay\n'
            '    if (job.config.RIPMETHOD in ("backup", "backup_dvd")) and job.disctype == "bluray":\n'
            '        _arm_record_check(job, rawpath, _arm_backup(job, rawpath) + _arm_bluray_problems(rawpath))\n'
            '    elif job.config.RIPMETHOD == "backup_dvd" and job.disctype == "dvd":\n'
            '        rawpath = _arm_backup_dvd(job, rawpath)\n'
            '    # Rip BluRay or DVD\n',
        ),
    ]


    def log(message):
        with open(ARMLOG, "a") as f:
            f.write(f"{datetime.datetime.now(datetime.timezone.utc):%a %b %d %H:%M:%S UTC %Y} [ARM] source-patches: {message}\n")


    failed = False
    for name, path, code in APPENDS:
        with open(path) as f:
            source = f.read()
        if f"_arm_source_patch {name}" in source:
            continue
        with open(code) as f:
            addition = f.read()
        with open(path, "a") as f:
            f.write(f"\n\n{addition}")
        log(f"applied {name} to {path}")

    for name, path, old, new in EDITS:
        with open(path) as f:
            source = f.read()
        if f"_arm_source_patch {name}" in source:
            continue
        count = source.count(old)
        if count != 1:
            log(f"cannot apply {name}: expected text found {count} times in {path}; skipped")
            failed = True
            continue
        with open(path, "w") as f:
            f.write(source.replace(old, new))
        log(f"applied {name} to {path}")

    sys.exit(1 if failed else 0)

  arm-whole-disc.py: |
    # --- _arm_source_patch whole-disc-code, appended by arm-source-patches.py -----
    # The raw copy of a disc is the whole disc, decrypted, in a folder stamped with
    # the job that made it, and a backup that is short fails its job rather than
    # passing for complete. Appended to makemkv.py, whose run(), progress_log(),
    # convert_to_seconds(), OutputType, TInfo, TrackID, TrackInfoProcessor and
    # utils it uses as module globals.
    import datetime as _arm_datetime  # noqa: E402
    import json as _arm_json  # noqa: E402
    import struct as _arm_struct  # noqa: E402


    # MakeMKV's TINFO attribute for the disc's own title number, ap_iaOriginalTitleId.
    _ARM_DISC_TITLE = 24


    def _arm_write_stamp(job, rawpath, problems=None, titles=None):
        # ARM's database records a job's completed path and never its raw one, and
        # a title corrected later renames only the completed folder. The stamp
        # travels with the raw folder through any rename. `complete` stays null
        # until the backup has been checked, so a folder whose job died mid-backup
        # never claims to be whole.
        stamp = {
            "schema": 1,
            "job_id": job.job_id,
            "label": job.label,
            "disctype": job.disctype,
            "crc_id": job.crc_id,
            "stage": job.stage,
            "start_time": job.start_time.astimezone(_arm_datetime.timezone.utc).isoformat()
            if job.start_time else None,
            "complete": None if problems is None else not problems,
            "problems": problems or [],
            "titles": titles,
        }
        path = os.path.join(rawpath, "arm-job.json")
        with open(f"{path}.tmp", "w") as f:
            _arm_json.dump(stamp, f, indent=2)
            f.write("\n")
        os.replace(f"{path}.tmp", path)


    def _arm_record_check(job, rawpath, problems):
        _arm_write_stamp(job, rawpath, problems)
        if problems:
            for problem in problems:
                logging.critical(f"Backup incomplete: {problem}")
            raise utils.RipperException(f"The backup in {rawpath} is incomplete: {'; '.join(problems)}")
        logging.info(f"Backup in {rawpath} checked complete")


    def _arm_backup(job, dest):
        # makemkv_backup's command, run here because makemkv_backup discards every
        # message, and with them MakeMKV's report of clips whose data failed the
        # disc's own hashes. The files are kept at full size, so no size check
        # sees them.
        cmd = ["backup", "--decrypt"]
        cmd += shlex.split(job.config.MKV_ARGS)
        cmd += [
            f"--minlength={job.config.MINLENGTH}",
            f"--progress={progress_log(job)}",
            f"disc:{job.drive.mdisc:d}",
            dest,
        ]
        logging.info(f"Backing up disc to {dest}")
        return [
            message.message
            for message in run(cmd, OutputType.MSG)
            if message is not None and "failed hash check" in message.message
        ]


    def _arm_bluray_problems(rawpath):
        # Every clip's .clpi gives its source-packet count, a big-endian uint32 at
        # byte 56, and its .m2ts is 192 bytes a packet.
        clipinf = os.path.join(rawpath, "BDMV", "CLIPINF")
        stream = os.path.join(rawpath, "BDMV", "STREAM")
        if not os.path.isdir(clipinf):
            return ["BDMV/CLIPINF is missing"]
        clips = sorted(name for name in os.listdir(clipinf) if name.endswith(".clpi"))
        if not clips:
            return ["BDMV/CLIPINF holds no clips"]
        problems = []
        for clip in clips:
            with open(os.path.join(clipinf, clip), "rb") as f:
                header = f.read(60)
            m2ts = f"{clip[:-len('.clpi')]}.m2ts"
            if len(header) < 60:
                problems.append(f"CLIPINF/{clip} is too short to read")
                continue
            expected = 192 * _arm_struct.unpack_from(">I", header, 56)[0]
            try:
                size = os.path.getsize(os.path.join(stream, m2ts))
            except FileNotFoundError:
                problems.append(f"STREAM/{m2ts} is missing")
                continue
            if size < expected:
                problems.append(f"STREAM/{m2ts} is {size} bytes of {expected}")
        return problems


    def _arm_iso_problems(iso):
        # The image's own ISO 9660 volume descriptor, in sector 16, gives the
        # volume's size. MakeMKV writes it first, so a partial image still declares
        # the whole disc.
        name = os.path.basename(iso)
        if not os.path.isfile(iso):
            return [f"{name} is missing"]
        with open(iso, "rb") as f:
            f.seek(16 * 2048)
            descriptor = f.read(2048)
        if len(descriptor) < 2048 or descriptor[:6] != b"\x01CD001":
            return [f"{name} has no ISO 9660 volume descriptor"]
        blocks = _arm_struct.unpack_from("<I", descriptor, 80)[0]
        block_size = _arm_struct.unpack_from("<H", descriptor, 128)[0]
        size = os.path.getsize(iso)
        if size < blocks * block_size:
            return [f"{name} is {size} bytes of {blocks * block_size}"]
        return []


    def _arm_backup_dvd(job, rawpath):
        # The ISO is the drive's only read. Titles are extracted from it by MakeMKV
        # rather than HandBrake, which would meet a structure-protected disc's
        # decoy titles unguarded, and into titles/ because HandBrake's folder scan
        # counts every file beside them as a title. --noscan keeps those two runs
        # off the drive. For a DVD the destination is the image's file name: given
        # a folder, MakeMKV refuses it as already holding a backup.
        iso = os.path.join(rawpath, f"{os.path.basename(rawpath)}.iso")
        _arm_record_check(job, rawpath, _arm_backup(job, iso) + _arm_iso_problems(iso))

        titles = os.path.join(rawpath, "titles")
        os.makedirs(titles)
        # D14's patches match on MakeMKV's track rows, which ARM otherwise reads
        # from the drive.
        tracks = TrackInfoProcessor(job, None)
        found = {}
        info = ["info", "--cache=1", "--noscan", f"iso:{iso}", f"--minlength={job.config.MINLENGTH}"]
        for message in run(info, OutputType.CINFO | OutputType.SINFO | OutputType.TCOUNT | OutputType.TINFO):
            tracks._process_message(message)
            if isinstance(message, TInfo):
                found.setdefault(message.tid, {})[message.id] = message.value
        tracks._add_track()

        cmd = ["mkv"]
        cmd += shlex.split(job.config.MKV_ARGS)
        cmd += [
            "--noscan",
            f"--progress={progress_log(job)}",
            f"iso:{iso}",
            "all",
            titles,
            f"--minlength={job.config.MINLENGTH}",
        ]
        logging.info(f"Extracting titles from {iso}")
        collections.deque(run(cmd, OutputType.MSG), maxlen=0)
        # ARM looks for no titles saved only in MSG 5004, which MakeMKV sends when a
        # title failed. A run with no failures reports 5005.
        if not any(name.endswith(".mkv") for name in os.listdir(titles)):
            raise utils.RipperException(f"MakeMKV extracted no titles from {iso}")
        _arm_write_stamp(job, rawpath, [], _arm_title_map(found, titles))
        return titles


    def _arm_title_map(found, titles):
        # Each MKV against the disc's own title number, which is what finds it again
        # in the ISO once titles/ is gone: MakeMKV's _tNN counts only the titles it
        # kept. HandBrake numbers a folder's files from 1 in byte order of their
        # names (qsort in libhb/batch.c), and that number is ARM's title_N. It is
        # null for a title MakeMKV listed but did not save.
        saved = sorted(name for name in os.listdir(titles) if os.path.isfile(os.path.join(titles, name)))
        entries = []
        for _, attributes in sorted(found.items()):
            mkv = attributes.get(TrackID.FILENAME)
            disc_title = attributes.get(_ARM_DISC_TITLE)
            duration = attributes.get(TrackID.DURATION)
            entries.append({
                "disc_title": int(disc_title) if disc_title else None,
                "mkv": mkv,
                "length": convert_to_seconds(duration) if duration else None,
                "handbrake_title": saved.index(mkv) + 1 if mkv in saved else None,
            })
        return entries

