apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookdrop
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: ingress-nginx-internal
  tls:
    - hosts:
        - bookdrop.immortalkeep.com
      secretName: bookdrop-ingress-tls
  rules:
    - host: bookdrop.immortalkeep.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: bookdrop
                port:
                  number: 8000
