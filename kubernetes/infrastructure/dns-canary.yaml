# Proves that DNS filtering is actually happening. See docs/dns-filtering.md.
#
# Queries 192.168.0.202, the LoadBalancer address, rather than the in-cluster
# Service name: that is the path LAN and tailnet clients take, and a pod
# reaching it exercises MetalLB too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-canary
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      # Do not retry: a retry that succeeds hides the flap this exists to notice.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: busybox:1.37
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              env:
                - name: RESOLVER
                  value: "192.168.0.202"
                # Must be blocked. Chosen because it is pure ad-serving
                # infrastructure present on every mainstream list, so if this one
                # resolves the blocklist is not loaded at all. It must also be a
                # domain that genuinely exists, or "no answer" would mean "gone"
                # rather than "blocked".
                - name: BLOCKED_DOMAIN
                  value: "doubleclick.net"
                # Must resolve. If this fails, DNS is broken rather than strict,
                # and the run says so instead of blaming the filter.
                - name: CONTROL_DOMAIN
                  value: "cloudflare.com"
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  # Addresses only, with the "Server:"/"Address: <ip>:53" header
                  # lines dropped. Parsing this way rather than matching busybox's
                  # label format, which differs between versions.
                  answers() {
                    nslookup "$1" "$2" 2>/dev/null \
                      | sed -n '/^Name:/,$p' \
                      | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' \
                      | sort -u | tr '\n' ' '
                  }

                  fail=0

                  ctrl=$(answers "$CONTROL_DOMAIN" "$RESOLVER")
                  case " $ctrl " in
                    *" 0.0.0.0 "*|"  ")
                      echo "FAIL: $CONTROL_DOMAIN did not resolve via $RESOLVER — DNS is down, not filtering."
                      fail=1 ;;
                    *) echo "ok: $CONTROL_DOMAIN -> $ctrl" ;;
                  esac

                  # Nothing routable means blocked. Do NOT rewrite this to
                  # compare against an unfiltered resolver and treat a difference
                  # as success: doubleclick.net rotates its answer set, so that
                  # version passed while nothing was filtered at all.
                  got=$(answers "$BLOCKED_DOMAIN" "$RESOLVER")
                  routable=$(echo "$got" | tr ' ' '\n' | grep -vE '^(0\.0\.0\.0)?$' | tr '\n' ' ')
                  if [ -n "$routable" ]; then
                    echo "FAIL: $BLOCKED_DOMAIN resolved to '$routable' via $RESOLVER — filtering is not in effect."
                    fail=1
                  else
                    echo "ok: $BLOCKED_DOMAIN blocked via $RESOLVER (answer: '${got:-NXDOMAIN}')"
                  fi

                  exit $fail
