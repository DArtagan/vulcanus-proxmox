apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: image-update-automation
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Scoped so this and the apps automation cannot both rewrite and push the same
  # commit; without a path each one scans the whole repository.
  update:
    path: ./kubernetes/infrastructure
    strategy: Setters
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: william+fluxcd@weiskopf.me
        name: Flux Bot
