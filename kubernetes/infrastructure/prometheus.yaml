apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 88.2.0 # {"$imagepolicy": "infrastructure:kube-prometheus:tag"}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: kube-prometheus
spec:
  image: ghcr.io/prometheus-community/charts/kube-prometheus-stack
  # This repository carries over 1100 tags, so scan it hourly rather than at the
  # 15m used for application images.
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kube-prometheus
spec:
  imageRepositoryRef:
    name: kube-prometheus
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # This chart cuts a major roughly monthly, and each one bumps
      # prometheus-operator and therefore its CRDs. Crossing one means applying
      # the CRDs first — see the upgrade note in UPGRADE.md upstream, or enable
      # crds.upgradeJob once that leaves preview.
      range: '>=88.1.5 <89.0.0'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    # Rules had been evaluating into the void: without an Alertmanager, twelve
    # alerts were firing and reaching nobody — including two genuinely failed
    # rclone backup jobs, and PrometheusNotConnectedToAlertmanagers itself.
    alertmanager:
      enabled: true
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        ingressClassName: ingress-nginx-internal
        hosts:
          - alertmanager.immortalkeep.com
        paths:
          - /
        tls:
          - hosts:
              - alertmanager.immortalkeep.com
            secretName: alertmanager-ingress-tls
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/<name>/<key>, so credentials are
        # referenced by path below rather than inlined into this file.
        secrets:
          - notification-secrets
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
      config:
        global:
          resolve_timeout: 5m
        route:
          # Grouping is the whole point: one node problem should be one
          # notification, not forty. Six of the twelve alerts firing today
          # shared a single root cause.
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: pushover
          routes:
            # Watchdog fires forever by design, so the useful signal is its
            # absence. Pinging a dead-man's switch inverts it: the far end
            # complains when the pings stop, which is how monitoring failing
            # gets noticed rather than being silently dead.
            - matchers:
                - alertname = "Watchdog"
              receiver: deadmans-switch
              group_wait: 0s
              group_interval: 5m
              repeat_interval: 5m
            - matchers:
                - severity = "info"
              receiver: "null"
            # A meta-alert the chart fires purely to drive its own inhibit
            # rules. It carries severity "none", so the info route misses it
            # and it would otherwise page.
            - matchers:
                - alertname = "InfoInhibitor"
              receiver: "null"
        inhibit_rules:
          # When something is critical, the matching warning adds nothing.
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["alertname", "namespace"]
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal: ["alertname", "namespace"]
        receivers:
          - name: "null"
          - name: pushover
            pushover_configs:
              - user_key_file: /etc/alertmanager/secrets/notification-secrets/pushover-user-key
                token_file: /etc/alertmanager/secrets/notification-secrets/pushover-token
                # The default priority template is 2 — Pushover's "emergency",
                # which retries until acknowledged. Explicitly avoided: 1 raises
                # a critical above quiet hours, everything else stays normal.
                priority: '{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}'
                title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
                message: |-
                  {{ range .Alerts }}{{ .Annotations.summary }}
                  {{ if .Annotations.description }}{{ .Annotations.description }}
                  {{ end }}{{ end }}
                send_resolved: true
          - name: deadmans-switch
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/notification-secrets/deadmans-switch-url
                send_resolved: false
    # Talos binds these three components' metrics to localhost, so Prometheus
    # cannot scrape them and they alert as permanently Down — six of today's
    # twelve alerts, three of them critical. Disabling the scrapes stops the
    # noise; making them genuinely scrapable needs a machine config change and
    # is written up in docs/talos-terraform-migration-prompt.md.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    grafana:
      # Without this the password is the chart default, "prom-operator", which
      # is published in the chart's own values.yaml. Chart 79.x also drops that
      # default in favour of a random one, so pinning it here keeps the
      # credential stable across the upgrade as well as making it not public.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # /var/lib/grafana was an emptyDir, so every restart discarded the SQLite
      # database: the admin password reverted to the secret, UI-created
      # dashboards and users vanished, and the annotations the Flux Provider
      # posts on each reconcile went with them. Dashboards are provisioned from
      # config maps and survived, which is what made the rest easy to miss.
      #
      # Note this inverts how the password behaves. Grafana only honours
      # GF_SECURITY_ADMIN_PASSWORD when creating the admin on a fresh database,
      # so from here the secret no longer updates it — changing it means the UI,
      # or deleting the PVC. Enabled now precisely because the database is
      # currently fresh and was built from the secret, so the right credential
      # is the one being captured.
      #
      # storageClassName is explicit because no StorageClass is marked default
      # in this cluster; without it the claim would never bind.
      persistence:
        enabled: true
        type: pvc
        storageClassName: openebs-hostpath
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        ingressClassName: ingress-nginx-internal
        hosts:
          - grafana.immortalkeep.com
        tls:
          - hosts:
              - grafana.immortalkeep.com
            secretName: prometheus-grafana-ingress-tls
    prometheus:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        ingressClassName: ingress-nginx-internal
        hosts:
          - prometheus.immortalkeep.com
        tls:
          - hosts:
              - prometheus.immortalkeep.com
            secretName: prometheus-ingress-tls
      prometheusSpec:
        retention: 30d
        #resources:
        #  requests:
        #    cpu: 200m
        #    memory: 200Mi
        ruleSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}
        podMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        probeSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeNamespaceSelector: {}
        serviceMonitorSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: grafana
spec:
  providerRef:
    name: grafana
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: flux-system
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: grafana
spec:
  type: grafana
  address: "http://kube-prometheus-stack-grafana.monitoring/api/annotations"
  secretRef:
    name: grafana-auth
