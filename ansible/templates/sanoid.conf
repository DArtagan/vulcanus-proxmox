[rpool]
use_template = production
recursive = true

[rpool/ROOT]
use_template = pve
recursive = true

[rpool/ROOT/pve-1]
use_template = pve
recursive = true

[rpool/data]
use_template = pve
recursive = true

[rpool/proxmox_backup_server]
use_template = pve
recursive = true

[rpool/backups]
use_template = backups
recursive = true

# Overrides the recursive entry above for the restic repository alone.
[rpool/backups/restic]
use_template = restic


[template_production]
frequently = 0
hourly = 36
daily = 30
monthly = 24
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes


[template_backups]
frequently = 0
hourly = 36
daily = 30
monthly = 12
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes


# The restic repository keeps its own history, so these snapshots are for
# losing the repository itself: a bad prune, or a compromised repository host.
# No hourlies and no monthlies, because each snapshot pins the pack files
# restic's monthly `forget --prune` rewrites -- up to 20 GiB a prune -- for as
# long as it is kept. sanoid.service runs with TZ=UTC, so the daily lands just
# after 00:00 UTC and holds the whole UTC day before it: that night's K8up runs,
# the mass-file run and the last dumps. mini-nas pulls it within the hour.
[template_restic]
frequently = 0
hourly = 0
daily = 30
monthly = 0
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes


[template_pve]
frequently = 0
hourly = 0
daily = 30
monthly = 0
yearly = 0
autosnap = yes
autoprune = yes
monitor = yes
