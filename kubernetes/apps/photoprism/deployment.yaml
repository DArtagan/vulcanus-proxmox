apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  labels:
    app: photoprism
spec:
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
        # Selected by the dumps-only K8up Schedule as well as the nightly one.
        k8up-dump: "true"
      annotations:
        # Dumped beside its server, into a file of this run's own that is checked
        # before a byte is streamed: a failed dump streams nothing, and
        # overlapping Backups cannot read each other's half-written file. See
        # docs/backups.md.
        k8up.io/backupcommand: >-
          sh -c 'set -e; f=$(mktemp); trap "rm -f $f" EXIT;
          MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-dump -u root
          --single-transaction --databases "$MARIADB_DATABASE" > "$f";
          test -s "$f"; cat "$f"'
        k8up.io/backupcommand-container: database
        # K8up names a dump /<namespace>-<container><extension>, and every
        # database container here is called `database`, so the extension carries
        # the application's name or the dumps overwrite each other's history.
        k8up.io/file-extension: .photoprism.sql
    spec:
      containers:
        - name: photoprism
          image: photoprism/photoprism:260919 # {"$imagepolicy": "apps:photoprism"}
          env:
            - name: PHOTOPRISM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism
                  key: admin_password
            - name: PHOTOPRISM_SITE_URL
              value: https://photoprism.immortalkeep.com/
            - name: PHOTOPRISM_AUTO_IMPORT
              value: "60"
            - name: PHOTOPRISM_DATABASE_DRIVER
              value: mysql
            - name: PHOTOPRISM_DATABASE_SERVER
              value: "localhost:3306"
            - name: PHOTOPRISM_DATABASE_NAME
              value: photoprism
            - name: PHOTOPRISM_DATABASE_USER
              value: photoprism
            - name: PHOTOPRISM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism
                  key: database_password
            - name: PHOTOPRISM_DETECT_NSFW
              value: "true"
            - name: PHOTOPRISM_ORIGINALS_LIMIT
              value: "-1"
            - name: PHOTOPRISM_RESOLUTION_LIMIT
              value: "-1"
            - name: PHOTOPRISM_UPLOAD_LIMIT
              value: "-1"
          ports:
            - containerPort: 2342
          resources:
            limits:
              cpu: "300m"
          volumeMounts:
            - mountPath: /photoprism/storage
              name: data
            - mountPath: /photoprism/import
              name: photos
              subPath: photoprism/import
            - mountPath: /photoprism/originals
              name: photos
              subPath: photoprism/originals
        - name: database
          image: mariadb:10.11.19 # {"$imagepolicy": "apps:photoprism-mariadb"}
          args:
            - "--innodb-buffer-pool-size=128M"
            - "--transaction-isolation=READ-COMMITTED"
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--max-connections=512"
            - "--innodb-rollback-on-timeout=OFF"
            - "--innodb-lock-wait-timeout=120"
          env:
            - name: MARIADB_AUTO_UPGRADE
              value: "true"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism
                  key: database_password
            - name: MARIADB_DATABASE
              value: photoprism
            - name: MARIADB_USER
              value: photoprism
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism
                  key: database_password
          ports:
            - containerPort: 3306
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: database
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: photoprism-data-pvc
        - name: database
          persistentVolumeClaim:
            claimName: photoprism-database-pvc
        - name: photos
          persistentVolumeClaim:
            claimName: photos-pvc
