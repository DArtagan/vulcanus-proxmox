- name: 'zfs configuration'
  hosts: proxmox
  vars:
    zpool: rpool

  tasks:
    # Exports are declared in nfs.yaml. sharenfs is inherited, so set here it
    # would export every dataset beneath to whichever clients it names.
    - name: 'storage dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage"
        state: present
        extra_zfs_properties:
          sharenfs: 'off'

    - name: 'storage/filesync dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/filesync"
        state: present
      notify: 'add filesync dataset to proxmox'

    - name: 'storage/media dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/media"
        state: present
      notify: 'add media dataset to proxmox'

    - name: 'storage/photos dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/photos"
        state: present
      notify: 'add photos dataset to proxmox'

    # A library: nfs.yaml sets its default ACLs, which need acltype=posix.
    - name: 'storage/books dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/books"
        state: present
        extra_zfs_properties:
          acltype: posix
      notify: 'add books dataset to proxmox'

    - name: 'backups/restic dataset'
      community.general.zfs:
        name: "{{ zpool }}/backups/restic"
        state: present

    # rest-server runs as `restic`, uid 291 in the unprivileged container and
    # so 100291 here. No `pvesm add dir` handler: terraform/main.tf bind-mounts
    # the host path, so a PVE storage would be an entry nothing reads.
    - name: 'backups/restic ownership, shifted for the unprivileged container'
      file:
        path: "/{{ zpool }}/backups/restic"
        owner: 100291
        group: 100291
        state: directory

    # The restic container mounts these read-write, sees them owned by nobody,
    # and so can change any entry that is world-writable: filesync's top
    # directory was 777, which let it rename or delete syncthing/. nfs.yaml
    # holds the libraries tighter; a tree leaves this list when it joins
    # nfs_exports.
    - name: 'trees the restic container mounts: never world-writable'
      shell: find {{ item | quote }} -perm -o+w ! -type l -print -exec chmod o-w {} +
      loop:
        - "/{{ zpool }}/storage/photos"
        - "/{{ zpool }}/storage/filesync"
      register: world_writable
      changed_when: world_writable.stdout != ''

    # restic reads the libraries through storage-read, so host gid 1200 passes
    # into the container unshifted and every other id keeps the default shift.
    # The container gets whatever that gid may do on the trees mounted into it,
    # read-write mounts, so it stays read-only only while no mounted entry
    # gives the group write; nfs.yaml holds the libraries to that.
    # nixos/hosts/restic-repository puts restic in the group.
    #
    # Line by line, not blockinfile: Proxmox reads a config's # lines as the
    # container's description and moves them. Its API updates rewrite only the
    # options they are given and write raw lxc.* lines back, but a recreated
    # container loses them, and restic then fails its next run on the
    # libraries it cannot read. All four lines or none: with only some, the
    # container will not start. The mapping takes effect at the container's
    # next start, left to a quiet moment because a restart interrupts backups.
    - name: 'let root map host gid 1200 into containers'
      lineinfile:
        path: /etc/subgid
        line: 'root:1200:1'

    - name: 'restic repository container: storage-read unshifted'
      lineinfile:
        path: /etc/pve/lxc/108.conf
        line: "{{ item }}"
        insertbefore: '^\['
        firstmatch: true
      loop:
        - 'lxc.idmap: u 0 100000 65536'
        - 'lxc.idmap: g 0 100000 1200'
        - 'lxc.idmap: g 1200 1200 1'
        - 'lxc.idmap: g 1201 101201 64335'

    - name: 'proxmox_backup_server'
      community.general.zfs:
        name: "{{ zpool }}/proxmox_backup_server"
        state: present
      notify: 'add add_proxmox_backup_server dataset to the rpool'

  # Each fires on any change to its dataset, a property included, so it adds
  # the storage only where it is missing.
  handlers:
    - name: 'add filesync dataset to proxmox'
      shell: pvesm status --storage storage_filesync >/dev/null 2>&1 || pvesm add dir storage_filesync --path /rpool/storage/filesync --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add media dataset to proxmox'
      shell: pvesm status --storage storage_media >/dev/null 2>&1 || pvesm add dir storage_media --path /rpool/storage/media --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add photos dataset to proxmox'
      shell: pvesm status --storage storage_photos >/dev/null 2>&1 || pvesm add dir storage_photos --path /rpool/storage/photos --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add books dataset to proxmox'
      shell: pvesm status --storage storage_books >/dev/null 2>&1 || pvesm add dir storage_books --path /rpool/storage/books --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add proxmox_backup_server dataset to the rpool'
      shell: pvesm status --storage proxmox_backup_server >/dev/null 2>&1 || pvesm add dir proxmox_backup_server --path /rpool/proxmox_backup_server --is_mountpoint 1 --shared 0 --content images
