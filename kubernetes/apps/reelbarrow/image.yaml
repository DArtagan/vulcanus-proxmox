apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: reelbarrow
spec:
  image: ghcr.io/dartagan/reelbarrow
  interval: 15m0s

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: reelbarrow
spec:
  imageRepositoryRef:
    name: reelbarrow
  policy:
    semver:
      range: ">=0.1.0 <1.0.0"
