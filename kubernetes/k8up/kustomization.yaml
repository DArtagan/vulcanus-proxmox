apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: it would move every Schedule into one namespace. Each
# object names its own. See docs/backups.md.
resources:
  - coverage
  - image-update-automation.yaml
  - secret-apps.sops.yaml
  - secret-automatic-ripping-machine.sops.yaml
  - secret-infrastructure.sops.yaml
  - schedule-apps.yaml
  - schedule-automatic-ripping-machine.yaml
  - schedule-infrastructure.yaml
  - sqlite3-image.yaml
patches:
  - path: schedule-defaults.yaml
    target:
      kind: Schedule
