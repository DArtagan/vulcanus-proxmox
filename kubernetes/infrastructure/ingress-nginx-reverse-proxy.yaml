apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ingress-nginx
spec:
  interval: 1h
  url: oci://registry.k8s.io/ingress-nginx/charts/ingress-nginx
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v4.15.1 # {"$imagepolicy": "infrastructure:ingress-nginx:tag"}

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ingress-nginx
spec:
  image: registry.k8s.io/ingress-nginx/charts/ingress-nginx
  interval: 1h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ingress-nginx
spec:
  imageRepositoryRef:
    name: ingress-nginx
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=4.15.1 <5.0.0'

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-internal
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ingress-nginx
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: ingress-nginx-internal
    controller:
      electionID: ingress-nginx-internal
      ingressClassResource:
        name: ingress-nginx-internal
        controllerValue: "k8s.io/ingress-nginx-internal"
        default: true
      ingressClass: ingress-nginx-internal
      metrics:
        enabled: true
        serviceMonitor:
          namespace: infrastructure
      podAnnotations:
        prometheus.io/scrape: true
        prometheus.io/port: 10254
      service:
        loadBalancerIP: "192.168.0.203"
        # No metallb.io/allow-shared-ip here on purpose. Mumble briefly shared
        # this address so that immortalkeep.com:64738 would work alongside
        # mumble.immortalkeep.com:64738; see the note in coredns.yaml for why
        # that was reverted. This address serves HTTP and nothing else.
    # No tcp:/udp: blocks. Mumble and Syncthing now have their own LoadBalancer
    # addresses, so nothing needs the stream proxy — which never suited them
    # anyway. These keys are not part of the Ingress API; they configure an
    # nginx stream block bolted onto an HTTP controller.

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-external
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ingress-nginx
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: ingress-nginx-external
    controller:
      electionID: ingress-nginx-external
      ingressClassResource:
        name: ingress-nginx-external
        controllerValue: "k8s.io/ingress-nginx-external"
        default: false
      ingressClass: ingress-nginx-external
      metrics:
        enabled: true
        serviceMonitor:
          namespace: infrastructure
      podAnnotations:
        prometheus.io/scrape: true
        prometheus.io/port: 10254
      service:
        loadBalancerIP: "192.168.0.201"
    # See the note on the internal controller: both L4 services moved to their
    # own LoadBalancer addresses.
