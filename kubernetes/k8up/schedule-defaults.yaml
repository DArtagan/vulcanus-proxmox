# Patched onto every Schedule, so the repository string is byte-identical in
# all of them and every Job runs as root. See docs/backups.md.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: every-schedule
spec:
  podSecurityContext:
    runAsUser: 0
  backend:
    repoPasswordSecretRef:
      name: k8up-repository
      key: repository-password
    rest:
      url: http://192.168.0.108:8000/
      userSecretRef:
        name: k8up-repository
        key: rest-username
      # Upstream's spelling: `passwordSecretRef` is silently ignored.
      passwordSecretReg:
        name: k8up-repository
        key: rest-password
