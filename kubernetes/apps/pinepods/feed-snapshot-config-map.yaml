apiVersion: v1
kind: ConfigMap
metadata:
  name: pinepods-feed-snapshot
data:
  snapshot.sh: |
    #!/bin/sh
    # Archive the raw bytes of every subscribed RSS feed.
    #
    # PinePods stores parsed episodes, not the original XML. Feeds that trim their
    # backlog therefore lose history that nothing else preserves. This keeps a
    # dated snapshot each time a feed's bytes change, which is the substrate a
    # cumulative re-hostable feed can be rebuilt from later.
    set -eu

    SNAPSHOT_DIR=/archive
    API=http://pinepods.apps.svc.cluster.local:8040/api/data/backup_user

    # Read the subscription list from PinePods rather than keeping a second copy,
    # so the two can never drift. Feed URLs carry auth tokens, so they are never
    # logged and never written to disk outside the fetch itself.
    opml=$(curl -fsS -X POST "$API" \
      -H "Api-Key: ${PINEPODS_API_KEY}" \
      -H "Content-Type: application/json" \
      -d "{\"user_id\": ${ARCHIVE_USER_ID}}")

    # One outline element per line, so title and xmlUrl can be read together
    # regardless of the order the attributes appear in.
    printf '%s' "$opml" \
      | tr '>' '\n' \
      | grep 'xmlUrl="' \
      > /tmp/outlines.txt

    # An unreadable feed list must not look like a clean run of zero feeds.
    # Without this the loop's redirect fails, nothing is checked, and the job
    # still reports success — silence indistinguishable from a healthy run.
    if [ ! -f /tmp/outlines.txt ]; then
      echo "ERROR: feed list was never written"
      exit 1
    fi

    checked=0
    written=0
    failed=0

    while IFS= read -r outline; do
      url=$(printf '%s' "$outline" | sed -n 's/.*xmlUrl="\([^"]*\)".*/\1/p')
      [ -n "$url" ] || continue
      title=$(printf '%s' "$outline" | sed -n 's/.*title="\([^"]*\)".*/\1/p')
      checked=$((checked + 1))

      # Directory name is the host plus a hash of the whole URL. Credentials and
      # tokens turn up in the path as often as the query string — a private feed
      # can be .../show/614946/<base64 user:pass>/ — so no part of the path is
      # safe to reuse verbatim on a shared volume that also goes into backups.
      # The hash keeps one directory per feed without revealing any of it.
      host=$(printf '%s' "$url" \
        | sed -e 's|^[a-zA-Z][a-zA-Z0-9+.-]*://||' -e 's|[/?].*$||' \
        | tr -c 'A-Za-z0-9.-' '_')
      hash=$(printf '%s' "$url" | sha256sum | cut -c1-12)
      slug="${host}_${hash}"

      dir="${SNAPSHOT_DIR}/${slug}"
      mkdir -p "$dir"

      # The show title is public and makes the archive navigable, unlike the URL.
      if [ -n "$title" ] && [ ! -f "${dir}/title.txt" ]; then
        printf '%s\n' "$title" > "${dir}/title.txt"
      fi

      tmp=$(mktemp)
      if ! curl -fsSL --max-time 120 -o "$tmp" "$url"; then
        echo "WARN: fetch failed for ${slug}"
        rm -f "$tmp"
        failed=$((failed + 1))
        continue
      fi

      # Only write when the bytes actually changed, so unchanged feeds cost
      # nothing and the snapshot store stays bounded.
      latest=$(find "$dir" -name '*.xml' -type f | sort | tail -n 1)
      if [ -n "$latest" ]; then
        new_hash=$(sha256sum "$tmp" | cut -d' ' -f1)
        old_hash=$(sha256sum "$latest" | cut -d' ' -f1)
        if [ "$new_hash" = "$old_hash" ]; then
          rm -f "$tmp"
          continue
        fi
      fi

      mv "$tmp" "${dir}/$(date -u +%Y-%m-%dT%H-%M-%SZ).xml"
      written=$((written + 1))
      echo "snapshot: ${slug}"
    done < /tmp/outlines.txt

    echo "checked ${checked} feeds, wrote ${written} snapshots, ${failed} failures"

    # A feed that stops resolving is exactly the loss this archive guards against,
    # so surface it as a job failure rather than passing quietly.
    [ "$failed" -eq 0 ]
