apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here, deliberately. A Schedule backs up the namespace it lives
# in, and a transformer would rewrite every object into the one it named -- the
# apps Schedule included, leaving apps backed up by nothing while Flux reports
# Ready. Each object names its own. See docs/backups.md.
resources:
  - secret-apps.sops.yaml
  - secret-automatic-ripping-machine.sops.yaml
  - secret-infrastructure.sops.yaml
  - schedule-apps.yaml
  - schedule-automatic-ripping-machine.yaml
  - schedule-infrastructure.yaml
patches:
  - path: schedule-defaults.yaml
    target:
      kind: Schedule
