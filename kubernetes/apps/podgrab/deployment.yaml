apiVersion: apps/v1
kind: Deployment
metadata:
  name: podgrab
  labels:
    app: podgrab
spec:
  # Superseded by pinepods. Scaled to zero rather than deleted so the manifests
  # and its 15.5 MB SQLite database stay available while the replacement proves
  # itself. Its database still references the pre-migration /assets paths, so
  # scaling it back up after the podcasts/ tree was relocated would make it
  # re-download all 8 feeds — retire it rather than restarting it.
  replicas: 0
  selector:
    matchLabels:
      app: podgrab
  template:
    metadata:
      labels:
        app: podgrab
    spec:
      containers:
        - name: podgrab
          image: akhilrex/podgrab:1.0.0 # {"$imagepolicy": "apps:podgrab"}
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
          volumeMounts:
            - mountPath: /config
              name: data
            - mountPath: /assets
              name: audio
              subPath: podcasts/
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: podgrab-data-pvc
        - name: audio
          persistentVolumeClaim:
            claimName: audio-rw-pvc
