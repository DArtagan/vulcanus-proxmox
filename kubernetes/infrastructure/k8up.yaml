apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8up
spec:
  interval: 24h
  url: https://k8up-io.github.io/k8up

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
spec:
  interval: 15m
  chart:
    spec:
      chart: k8up
      # Bumped by hand: no OCI chart is published for the image automation to
      # follow. Chart and operator are versioned apart: 4.10.0 deploys v2.16.0.
      version: 4.10.0
      sourceRef:
        kind: HelmRepository
        name: k8up
      interval: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    k8up:
      # With it on, controller-runtime renews a Lease every 2s against etcd's
      # spinning disks, and an etcd stall makes the holder exit: crash-looping
      # through the backup window. Safe only with one replica and the Recreate
      # below, so never scale this up. openebs.yaml does the same.
      enableLeaderElection: false
      envVars:
        # Empty turns off the Pushgateway push, whose default address reaches
        # nothing and logs an ERROR per item. A Pushgateway would not help: K8up
        # groups pushes by namespace, so each item's push replaces the last, and
        # the snapshot summaries hold the same numbers per item. Only here: an
        # empty promURL on a Schedule falls back to this.
        #
        # Never add INSECURE_ALLOW_PODEXEC_SPDY_FALLBACK: SPDY exec streaming
        # silently dropped the ends of dumps (k8up#1109).
        - name: BACKUP_PROMURL
          value: ""
    metrics:
      # So TargetDown covers the operator. Not for backup success: no metric
      # carries a claim, and k8up_schedule_last_job_succeeded is set only by
      # Check, Prune, Restore and Archive, never a backup. A Backup's namespace
      # is in exported_namespace. The coverage check reads the store instead.
      serviceMonitor:
        enabled: true
      # Its rules fire on a failed job, which cannot resolve itself. See
      # "alert on the absence of recent success" in docs/README.md.
      prometheusRule:
        enabled: false
  # The chart sets no strategy, so it would default to RollingUpdate and run two
  # operators through every upgrade with nothing electing between them. `add`,
  # since the rendered manifest has no strategy to replace.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: k8up
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
