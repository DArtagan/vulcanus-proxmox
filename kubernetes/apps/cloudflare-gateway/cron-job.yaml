# Rebuilds the Cloudflare Gateway block lists and the DNS policy that uses them.
# Everything it needs comes from the Secret: the account ID and a token scoped
# to Zero Trust.
#
# `command` overrides the image's ENTRYPOINT, and that is the point. The
# entrypoint ignores its arguments, writes a crontab and runs crond in the
# foreground forever — sensible for `docker run`, fatal here, because the Job
# would never complete and concurrencyPolicy: Forbid would then skip every
# subsequent run in silence. Do not remove it in favour of the image default.
#
# Runs as root, unlike everything else in this repo. The image is built FROM
# node:alpine with no USER, WORKDIR /app owned by root, and download_lists.js
# writes allowlist.txt and blocklist.txt into that working directory — npm runs
# scripts from the package root regardless of workingDir, so there is nowhere
# else for them to go. runAsNonRoot or readOnlyRootFilesystem here produces a
# CronJob that cannot write its own inputs. Capabilities are still dropped
# entirely and privilege escalation is off. Fixing this properly means a USER
# and a writable working directory upstream.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-gateway-sync
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  schedule: "30 10 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/dartagan/cloudflare-gateway-pihole-scripts:20260101000000 # {"$imagepolicy": "apps:cloudflare-gateway-sync"}
              command: ["npm", "start", "--prefix", "/app/"]
              env:
                # 300 lists x 1,000 entries, measured against the account on
                # 2026-09-11: the 1,001st entry is refused with "list size is
                # limited to 1000 items" and the 301st list with "2017 Maximum
                # number of lists reached".
                #
                # Cloudflare's account-limits page says "Lists: 100", which would
                # make this 100000. It is wrong. Do not lower this to match the
                # documentation without re-measuring first — that trade would
                # give up two thirds of the capacity on the strength of a page
                # that has already been checked and found incorrect.
                - name: CLOUDFLARE_LIST_ITEM_LIMIT
                  value: "300000"
                # Setting this replaces upstream's recommended allowlists rather
                # than extending them, so they are repeated verbatim and the
                # household's own file is appended last. Re-check them against
                # lib/constants.js on an image bump: upstream changing its own
                # defaults is invisible from here.
                #
                # The household file is fetched from the profile Service rather
                # than mounted, because download_lists.js unlinks and rewrites
                # ./allowlist.txt before anything reads it, which fails outright
                # against a read-only ConfigMap mount.
                - name: ALLOWLIST_URLS
                  value: |-
                    https://raw.githubusercontent.com/im-sm/Pi-hole-Torrent-Blocklist/main/all-torrent-trackres.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/banks.txt
                    https://raw.githubusercontent.com/Dogino/Discord-Phishing-URLs/main/official-domains.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/mac.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/windows.txt
                    https://raw.githubusercontent.com/boutetnico/url-shorteners/master/list.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/firefox.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/android.txt
                    https://raw.githubusercontent.com/TogoFire-Home/AD-Settings/main/Filters/whitelist.txt
                    https://raw.githubusercontent.com/DandelionSprout/AdGuard-Home-Whitelist/master/whitelist.txt
                    https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/master/Filters/exclusions.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/issues.txt
                    http://cloudflare-gateway-profile/allowlist.txt
              envFrom:
                - secretRef:
                    name: cloudflare-gateway-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          restartPolicy: OnFailure
