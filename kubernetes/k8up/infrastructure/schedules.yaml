apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: full
  namespace: infrastructure
spec:
  backup:
    # UTC. Staggered: K8up serialises jobs only within a namespace, so full
    # runs at once would be three restic writers on the same spindles. Clear
    # of the repository host's jobs too; see docs/backups.md.
    schedule: "30 1 * * *"
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: dumps
  namespace: infrastructure
spec:
  backup:
    # The label narrows this to the dumps. `full` takes them at 01:30.
    schedule: "30 7,13,19 * * *"
    labelSelectors:
      - matchLabels:
          k8up-dump: "true"
