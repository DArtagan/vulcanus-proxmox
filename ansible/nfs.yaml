# The cluster's NFS exports, served by the hypervisor, which holds the datasets.
#
# Every request is squashed to the cluster's storage account, piraeus:storage-read
# (1100:1200; ansible/fileserver.yaml defines both on the fileserver). With
# sec=sys the server trusts the client node, not the pod, so what separates
# workloads is which claims each mounts, not uids.

- name: 'export storage to the cluster over NFS'
  hosts: proxmox
  vars:
    piraeus_uid: 1100
    storage_read_gid: 1200
    # The workers. kubelet mounts from the node's address; the control plane
    # mounts nothing.
    nfs_clients:
      - 192.168.0.195
      - 192.168.0.196
    nfs_exports:
      - /rpool/storage/books

  tasks:
    - name: install the NFS server, and the ACL tools the libraries need
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - acl
        state: present

    # Every export is a library: piraeus writes, storage-read only reads, and
    # nothing else may do either. restic reads through storage-read, the one
    # host gid its container maps in (zfs.yaml), so a group or world bit here
    # is write or read access from that container. Modes are exact because a
    # library holds nothing executable. A copy that keeps its source's uid
    # leaves a tree no writer can write; the chown puts it right.
    #
    # The default ACL on every directory fixes new entries at 2750/0640
    # whatever the writer's umask, which over NFS is the pod's. It needs
    # acltype=posix on the dataset (zfs.yaml). New directories inherit it, so
    # the check finds only those made some other way, such as by cp -a.
    - name: hold the exported trees to the library tier
      ansible.builtin.shell: |
        set -euo pipefail
        {
          find {{ item | quote }} \( ! -user {{ piraeus_uid }} -o ! -group {{ storage_read_gid }} \) \
            -print -exec chown -h {{ piraeus_uid }}:{{ storage_read_gid }} {} +
          find {{ item | quote }} -type d ! -perm 2750 -print -exec chmod 2750 {} +
          find {{ item | quote }} -type f ! -perm 0640 -print -exec chmod 0640 {} +
          find {{ item | quote }} -type d -exec sh -c '
            set -e
            want=$(printf "user::rwx\ngroup::r-x\nother::---")
            for d; do
              [ "$(getfacl -dcnp -- "$d")" = "$want" ] && continue
              printf "%s\n" "$d"
              setfacl -d --set u::rwx,g::r-x,o::--- -- "$d"
            done' sh {} +
        } | wc -l
      args:
        executable: /bin/bash
      with_items: "{{ nfs_exports }}"
      register: owned
      changed_when: owned.stdout | int > 0

    - name: create the NFS configuration drop-in directory
      ansible.builtin.file:
        path: /etc/nfs.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: serve NFSv4.2 only
      ansible.builtin.copy:
        dest: /etc/nfs.conf.d/cluster.conf
        content: |
          # Managed by ansible/nfs.yaml.
          [nfsd]
          vers3=n
          vers4.0=n
          vers4.1=n
          vers4.2=y
        owner: root
        group: root
        mode: '0644'
      notify: restart nfs-server

    # Here rather than as sharenfs on the datasets: exports(5) keeps per-client
    # options readable, and sharenfs on rpool/storage once exported every child
    # read-write to the whole LAN without anything in this repo saying so.
    - name: declare the exports
      ansible.builtin.template:
        src: cluster.exports.j2
        dest: /etc/exports.d/cluster.exports
        owner: root
        group: root
        mode: '0644'
      notify: re-export

    - name: start the NFS server and enable it on boot
      ansible.builtin.systemd:
        name: nfs-server
        enabled: true
        state: started

  handlers:
    - name: restart nfs-server
      ansible.builtin.systemd:
        name: nfs-server
        state: restarted

    - name: re-export
      ansible.builtin.command: exportfs -ra
