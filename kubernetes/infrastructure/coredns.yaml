apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns
spec:
  interval: 1h
  url: oci://ghcr.io/coredns/charts/coredns
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.47.0 # {"$imagepolicy": "infrastructure:coredns:tag"}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coredns
spec:
  image: ghcr.io/coredns/charts/coredns
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coredns
spec:
  imageRepositoryRef:
    name: coredns
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=1.47.0 <2.0.0'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: coredns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The whole Corefile comes from a SOPS-encrypted Secret; edit
  # coredns-servers.yaml.template, not the Secret. See docs/dns-filtering.md.
  #
  # `servers` must not be added back to `values` below. Helm replaces lists
  # rather than merging them and inline values are merged last, so an inline
  # copy would silently win and the encrypted one would be dead weight.
  valuesFrom:
    - kind: Secret
      name: coredns-servers
      valuesKey: servers.yaml
  values:
    isClusterService: false
    prometheus:
      service:
        enabled: true
      # Without this the metrics Service above is exposed and scraped by nobody.
      # The only CoreDNS the stack watches by default is the cluster's kube-dns
      # in kube-system, so every DNS latency figure in Grafana describes pod
      # lookups rather than the resolver the LAN and the tailnet actually use.
      monitor:
        enabled: true
    service:
      loadBalancerIP: "192.168.0.202"
    serviceType: LoadBalancer
    zoneFiles:
      - filename: db.immortalkeep.com
        domain: immortalkeep.com
        contents: |-
          $ORIGIN immortalkeep.com.
          $TTL 1h

          ; --- SOA & NS ---
          @                       IN  SOA  ns.immortalkeep.com. hostmaster.immortalkeep.com. (
                                               2026080701 ; serial (YYYYMMDDNN)
                                               86400      ; refresh (1d)
                                               7200       ; retry (2h)
                                               2419200    ; expire (4w)
                                               3600 )     ; negative cache TTL (1h)
          @                       IN  NS   ns.immortalkeep.com.

          ; --- Infrastructure hosts ---
          vulcanus                IN  A    192.168.0.111
          proxmox-backup-server   IN  A    192.168.0.107
          fileserver              IN  A    192.168.0.105
          ns                      IN  A    192.168.0.202  ; CoreDNS

          ; --- Kubernetes nodes ---
          piraeus-control-plane-0 IN  A    192.168.0.190
          piraeus-worker-0        IN  A    192.168.0.195
          piraeus-worker-1        IN  A    192.168.0.196
          piraeus-api             IN  A    192.168.0.200  ; cluster VIP

          ; --- Services with their own LoadBalancer IP ---
          ; Must be listed explicitly, otherwise the wildcard below sends them
          ; to the internal ingress, which does not serve their ports.
          rustdesk                IN  A    192.168.0.204
          mumble                  IN  A    192.168.0.205
          ; Sync traffic only. syncthing.immortalkeep.com is intentionally left
          ; to the wildcard so the web UI keeps reaching the ingress over TLS.
          syncthing-sync          IN  A    192.168.0.206

          ; --- Kubernetes services (via ingress) ---
          ; Wildcard routes all subdomains to internal ingress controller.
          ; Explicit records above take precedence over the wildcard.
          ;
          ; The apex serves the website and nothing else. Mumble in particular
          ; is not on it: the one supported name is mumble.immortalkeep.com.
          ; This matters because a resolver answers with an address, not an
          ; address and port, so the apex cannot point at Mumble without taking
          ; the website with it — and only clients using CoreDNS see this at
          ; all. Anyone on public DNS gets the WAN address for either name and
          ; is forwarded to 192.168.0.205 regardless.
          ;
          ; It was briefly done the other way, in Aug 2026: a second Service
          ; sharing 192.168.0.203 with the ingress via MetalLB, so that both
          ; names worked for LAN clients. Reverted deliberately. Sharing an
          ; address forces the Cluster external traffic policy, which SNATs
          ; every client arriving on the apex to a single pod-network address —
          ; they stop being distinguishable in the Mumble log — and it drops
          ; the guarantee that voice lands on the node running the pod, so a
          ; reschedule silently adds a hop. It also coupled the ingress address
          ; to Mumble's config, which put every internal HTTPS service in the
          ; blast radius of a Mumble mistake. One canonical name is less to
          ; maintain and none of that is true of it.
          @                       IN  A    192.168.0.203
          *.immortalkeep.com.     IN  A    192.168.0.203

          ; --- MetalLB service IPs (for reference) ---
          ; 192.168.0.201 = ingress-nginx-external
          ; 192.168.0.202 = CoreDNS (this service)
          ; 192.168.0.203 = ingress-nginx-internal
          ; 192.168.0.204 = rustdesk (hbbs + hbbr)
          ; 192.168.0.205 = mumble (64738 tcp+udp)
          ; 192.168.0.206 = syncthing sync (22000 tcp+udp)
          ; Pool is 192.168.0.201-210, so 207-210 remain. Check the router's
          ; DHCP range before widening it.
          ;
          ; --- Router DHCP DNS settings ---
          ; Primary: 192.168.0.202 (CoreDNS)
          ; Secondary: 1.1.1.1 (Cloudflare, failover when CoreDNS/cluster is down)
