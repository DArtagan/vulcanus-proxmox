apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-smb
spec:
  interval: 24h
  # The kubernetes-csi.github.io Pages repository only publishes 1.20.x, so it
  # cannot serve the pinned 1.14.0. This raw branch URL carries the full history.
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts


---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-smb
      version: 1.14.0
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
