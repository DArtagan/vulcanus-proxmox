# Note: it's also possible that this all could have been done by mounting raw block devices from hostpaths
# https://kubernetes.io/blog/2019/03/07/raw-block-volume-support-to-beta/
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
      - operator: "Exists"
        effect: "NoExecute"
      - operator: "Exists"
        effect: "NoSchedule"
      containers:
      # Pinned by digest: upstream publishes only git-SHA tags plus `latest`, with
      # no semver anywhere, so there is nothing for a Flux ImagePolicy to order on.
      # This digest was `latest` on 2026-08-14.  See todos/version-notification-prompt.md.
      - image: ghcr.io/squat/generic-device-plugin@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
        args:
        # The resource domain is left implicit, taking upstream's default of
        # `devic.es`.  The devices are therefore advertised as `devic.es/cdrom`,
        # which is what automatic-ripping-machine requests.
        #
        # The domain forms half of that resource name, and upstream has changed
        # the default before — it was `squat.ai` in the image pinned here until
        # 2026-08-14.  If a future image bump changes it again, ARM will keep
        # running on its existing allocation and then go Pending on its next
        # restart, with nothing to indicate why.  Should that happen, compare
        # `kubectl get nodes -o custom-columns=...:.status.allocatable.devic\.es/cdrom`
        # against ARM's `resources.limits`, and pin `--domain devic.es` here.
        - --device
        # The by-id path is what distinguishes the real Pioneer burner from the
        # QEMU virtual DVD-ROM that every Talos VM exposes at /dev/sr0 for its
        # install ISO.  Both look identical as bare /dev/sr0, so matching on the
        # bare path made the control plane advertise a phantom drive that
        # automatic-ripping-machine could be scheduled onto.
        #
        # A group is only advertised when all of its non-optional paths match
        # something — a path with no matches drives the group's length to zero.
        # Matching the drive *model* therefore means only the node physically
        # holding that drive advertises `devic.es/cdrom`.  ARM schedules purely
        # on that resource, so it follows the drive wherever Terraform attaches
        # it: no nodeSelector on either side, and nothing to keep in sync.
        #
        # Adding other hardware (a GPU, say) is another `--device` group; the
        # DaemonSet stays on every node and self-selects by what is present.
        - |
          name: cdrom
          groups:
            - paths:
                - path: /dev/disk/by-id/ata-PIONEER_BD-RW_*
                  mountPath: /dev/sr0
                - path: /dev/sg0
        name: generic-device-plugin
        env:
        # Makes SIGQUIT dump *all* goroutines rather than only the running one.
        # The /metrics endpoint wedges permanently on nodes that have an optical
        # device — the process stays healthy and still answers /health and 404s
        # instantly, but every scrape then leaks a handler goroutine until the
        # 20Mi limit OOMKills it hours later, which is the only thing that
        # recovers it.  This is here so the next occurrence can be captured for
        # an upstream bug report.  Remove once that is filed and fixed.
        - name: GOTRACEBACK
          value: all
        # Upstream's defaults, kept deliberately.  A healthy pod sits flat at
        # ~10.3Mi and only grows when wedged, so raising the limit would not
        # prevent anything — it would just lengthen each outage.  Until the
        # upstream hang is fixed the OOMKill is the backstop that recovers it.
        resources:
          requests:
            cpu: 50m
            memory: 10Mi
          limits:
            cpu: 50m
            memory: 20Mi
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: dev
          mountPath: /dev
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: dev
        hostPath:
          path: /dev
  updateStrategy:
    type: RollingUpdate


---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: generic-device-plugin
  name: generic-device-plugin
  namespace: kube-system
spec:
  podMetricsEndpoints:
  - interval: 15s
    port: http
    path: /metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
