---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ingress-nginx
spec:
  interval: 1h
  url: oci://registry.k8s.io/ingress-nginx/charts/ingress-nginx
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v4.15.1  # {"$imagepolicy": "infrastructure:ingress-nginx:tag"}

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ingress-nginx
spec:
  image: registry.k8s.io/ingress-nginx/charts/ingress-nginx
  interval: 1h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ingress-nginx
spec:
  imageRepositoryRef:
    name: ingress-nginx
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=4.15.1 <5.0.0'

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-internal
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ingress-nginx
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: ingress-nginx-internal
    controller:
      electionID: ingress-nginx-internal
      ingressClassResource:
        name: ingress-nginx-internal
        controllerValue: "k8s.io/ingress-nginx-internal"
        default: true
      ingressClass: ingress-nginx-internal
      config:
        # nginx defaults proxy_responses to 1, meaning a UDP stream is torn down
        # after a single datagram comes back. That suits request/response
        # protocols and nothing else: Syncthing's QUIC and Mumble's voice are
        # both continuous and bidirectional, which is why every Syncthing
        # connection currently reports tcp-server and none report QUIC.
        # Raising it lets the session live until proxy_timeout instead.
        proxy-stream-responses: "10000"
      metrics:
        enabled: true
        serviceMonitor:
          namespace: infrastructure
      podAnnotations:
        prometheus.io/scrape: true
        prometheus.io/port: 10254
      service:
        loadBalancerIP: "192.168.0.203"
    # Syncthing's 21027 is deliberately absent: it is LAN discovery, UDP-only on
    # the Service, and broadcast-based, so it cannot be proxied through a
    # LoadBalancer. Mapping it as TCP pointed at a port the Service does not
    # expose, which nginx logged as a missing endpoint every few seconds.
    tcp:
      "64738": "apps/mumble:64738"
      "22000": "apps/syncthing:22000"
    udp:
      "64738": "apps/mumble:64738"
      "22000": "apps/syncthing:22000"

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-external
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: ingress-nginx
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: ingress-nginx-external
    controller:
      electionID: ingress-nginx-external
      ingressClassResource:
        name: ingress-nginx-external
        controllerValue: "k8s.io/ingress-nginx-external"
        default: false
      ingressClass: ingress-nginx-external
      config:
        # nginx defaults proxy_responses to 1, meaning a UDP stream is torn down
        # after a single datagram comes back. That suits request/response
        # protocols and nothing else: Syncthing's QUIC and Mumble's voice are
        # both continuous and bidirectional, which is why every Syncthing
        # connection currently reports tcp-server and none report QUIC.
        # Raising it lets the session live until proxy_timeout instead.
        proxy-stream-responses: "10000"
      metrics:
        enabled: true
        serviceMonitor:
          namespace: infrastructure
      podAnnotations:
        prometheus.io/scrape: true
        prometheus.io/port: 10254
      service:
        loadBalancerIP: "192.168.0.201"
    # See the note on the internal controller: 21027 is LAN discovery and
    # cannot work through an ingress, least of all over TCP.
    tcp:
      "22000": "apps/syncthing:22000"
      "64738": "apps/mumble:64738"
    udp:
      "22000": "apps/syncthing:22000"
      "64738": "apps/mumble:64738"
