apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automatic-ripping-machine
resources:
  - api-keys.sops.yaml
  - audio-rw-arm-pvc.yaml
  - config-map.yaml
  - data-pvc.yaml
  - deployment.yaml
  - image.yaml
  - image-update-automation.yaml
  - ingress.yaml
  - namespace.yaml
  - service.yaml
  - video-arm-pvc.yaml
configMapGenerator:
  # A changed script changes this ConfigMap's name, so Flux rolls ARM and
  # kills any job running: merge a change here only while ARM is idle.
  - name: automatic-ripping-machine-init-scripts
    files:
      - scripts/arm_user_files_setup.sh
      - scripts/51-docker-arm.rules
      - scripts/arm-disc-wrapper.sh
      - scripts/arm-audio-handoff.sh
      - scripts/arm-title-charset.py
      - scripts/arm-source-patches.py
      - scripts/arm-raw-copy.py
      - scripts/arm-whole-disc.py
      - scripts/arm-duplicate-titles.py
      - scripts/armui.sh
