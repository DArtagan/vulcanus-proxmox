apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-smb
spec:
  interval: 24h
  url: https://kubernetes-csi.github.io/csi-driver-smb


---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-smb
      version: 1.14.0
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
