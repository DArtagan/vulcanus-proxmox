apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books-pvc
  annotations:
    # An SMB share, covered by ZFS replication rather than K8up.
    # See docs/backups.md.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: books-pv
