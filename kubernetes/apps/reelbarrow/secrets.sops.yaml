# REELBARROW_TMDB_TOKEN is TMDB's API Read Access Token, not its v3 API key,
# from https://www.themoviedb.org/settings/api. reelbarrow sends it as a bearer
# header, so it never appears in a URL.
#
# REELBARROW_FANART_KEY is fanart.tv's personal API key, from
# https://fanart.tv/get-an-api-key/. reelbarrow sends it as a header.
#
# REELBARROW_PLEX_TOKEN is a token of reelbarrow's own, made through Plex's PIN
# flow as reelbarrow's README describes, while signed in as the server's owner.
# It is listed under Plex's Authorized Devices as "reelbarrow", where it can be
# revoked alone. reelbarrow sends it as a header.
