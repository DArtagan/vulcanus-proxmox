# Proves that DNS filtering is actually happening. See docs/dns-filtering.md.
#
# Queries 192.168.0.202, the LoadBalancer address, rather than the in-cluster
# Service name: that is the path LAN and tailnet clients take, and a pod
# reaching it exercises MetalLB too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-canary
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      # Do not retry: a retry that succeeds hides the flap this exists to notice.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: busybox:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              env:
                - name: RESOLVER
                  value: "192.168.0.202"
                # Three ad networks, not one, and the run fails only if none of
                # them is blocked -- so a single domain leaving a blocklist
                # cannot blind the check, while filtering stopping entirely
                # still trips it. Each was verified blocked through Gateway
                # before being put here; verify any replacement the same way
                # rather than assuming, with:
                #   curl -H 'accept: application/dns-json' \
                #     "https://<sub>.cloudflare-gateway.com/dns-query?name=<d>&type=A"
                - name: BLOCKED_DOMAINS
                  value: "pagead2.googlesyndication.com ib.adnxs.com ads.pubmatic.com"
                # Must resolve. If this fails, DNS is broken rather than strict,
                # and the run says so instead of blaming the filter.
                - name: CONTROL_DOMAIN
                  value: "cloudflare.com"
                # Cloudflare's own test domains, which exercise the security
                # *categories* rather than the blocklist. They are safe: real
                # domains operated by Cloudflare for exactly this, not live
                # malware. Neither appears anywhere in hagezi NORMAL, so a pass
                # here can only come from the category policy the
                # cloudflare-gateway-policy CronJob maintains -- which is the
                # point, since nothing else notices if that policy is deleted.
                - name: CATEGORY_DOMAINS
                  value: "malware.testcategory.com phishing.testcategory.com"
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  # Addresses only, with the "Server:"/"Address: <ip>:53" header
                  # lines dropped. Parsing this way rather than matching busybox's
                  # label format, which differs between versions.
                  answers() {
                    nslookup "$1" "$2" 2>/dev/null \
                      | sed -n '/^Name:/,$p' \
                      | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' \
                      | sort -u | tr '\n' ' '
                  }

                  fail=0

                  ctrl=$(answers "$CONTROL_DOMAIN" "$RESOLVER")
                  case " $ctrl " in
                    *" 0.0.0.0 "*|"  ")
                      echo "FAIL: $CONTROL_DOMAIN did not resolve via $RESOLVER — DNS is down, not filtering."
                      fail=1 ;;
                    *) echo "ok: $CONTROL_DOMAIN -> $ctrl" ;;
                  esac

                  # What counts as blocked. An empty answer covers NXDOMAIN and
                  # REFUSED; 0.0.0.0 is what a blocklist match returns; and
                  # 162.159.36.12 / 162.159.46.12 are Cloudflare's block-page
                  # addresses, returned for a *category* match when the block
                  # page is enabled. Those last two are routable, so treating any
                  # routable answer as unblocked would call a working category
                  # policy broken.
                  #
                  # Do NOT rewrite this to compare against an unfiltered resolver
                  # and treat a difference as success: ad domains are
                  # geo-distributed and rotate, so that version passed while
                  # nothing was filtered at all.
                  is_blocked() {
                    echo "$1" | tr ' ' '\n' \
                      | grep -vE '^(0\.0\.0\.0|162\.159\.36\.12|162\.159\.46\.12)?$' \
                      | grep -q . && return 1
                    return 0
                  }

                  # $1 = label for the failure message, $2 = domains to try.
                  # Fails only when none of the set is blocked: one domain leaving
                  # a list is ordinary, the mechanism stopping is not.
                  check_set() {
                    label=$1; set_domains=$2
                    n=0; leaked=""
                    for d in $set_domains; do
                      got=$(answers "$d" "$RESOLVER")
                      if is_blocked "$got"; then
                        n=$((n + 1))
                        echo "ok: $d blocked via $RESOLVER (answer: '${got:-NXDOMAIN/REFUSED}')"
                      else
                        leaked="$leaked $d"
                      fi
                    done
                    if [ "$n" -eq 0 ]; then
                      echo "FAIL: $label — none of$leaked was blocked via $RESOLVER."
                      return 1
                    fi
                    [ -n "$leaked" ] && echo "note:$leaked resolved rather than blocked; $n of the set still blocked."
                    return 0
                  }

                  check_set "blocklist is not in effect" "$BLOCKED_DOMAINS" || fail=1
                  check_set "security category policy is not in effect" "$CATEGORY_DOMAINS" || fail=1

                  exit $fail
