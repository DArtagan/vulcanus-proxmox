# Rebuilds the Gateway block lists and the policy that uses them.
# See docs/dns-filtering.md.
#
# `args` rather than `command`, so the image's ENTRYPOINT still runs. It replaces
# the image's CMD, which is crond: leave it out and the container runs cron in
# the foreground forever, the Job never completes, and under concurrencyPolicy:
# Forbid every later run is skipped in silence.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-gateway-sync
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  schedule: "30 10 * * *"
  jobTemplate:
    spec:
      # Bounded because the upstream script retries fifty times and waits two
      # minutes between attempts on a 429, so one attempt can run for hours and a
      # hung one forever — and under Forbid, a job that never ends means no later
      # run ever starts. A healthy run takes minutes.
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        spec:
          securityContext:
            # 1000 is the image's `node` user, which owns /app. The sync unlinks
            # and rewrites allowlist.txt and blocklist.txt in its own WORKDIR, so
            # it needs write access there.
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/dartagan/cloudflare-gateway-pihole-scripts:20260101000000 # {"$imagepolicy": "apps:cloudflare-gateway-sync"}
              args: ["npm", "start", "--prefix", "/app/"]
              env:
                # 300 lists x 1,000 entries, measured. Cloudflare's
                # account-limits page says "Lists: 100" and is wrong; do not
                # lower this to match it without re-measuring first. See
                # docs/dns-filtering.md.
                - name: CLOUDFLARE_LIST_ITEM_LIMIT
                  value: "300000"
                # This replaces upstream's recommended allowlists rather than
                # extending them, so they are repeated verbatim here, then the
                # two additions, then the household's own file.
                #
                # Re-check the first twelve against lib/constants.js on an image
                # bump. Upstream editing its own defaults is invisible from here,
                # and it has already happened once: the torrent-tracker list was
                # carried for months as a 404 after upstream moved it to a new
                # owner and corrected a typo in the filename. A dead allowlist
                # URL fails silently -- the sync completes, the list simply
                # contributes nothing.
                #
                # See docs/dns-filtering.md.
                # Like ALLOWLIST_URLS, this replaces upstream's defaults rather
                # than extending them. Upstream's were oisd small plus adaway;
                # both are gone because they are redundant here, measured against
                # this list rather than assumed: adaway contributes 0 domains
                # that NORMAL does not already cover, and oisd small contributes
                # 1,019, which is 0.3% of the cap.
                #
                # PRO rather than NORMAL, by Will's decision. hagezi describes
                # PRO as rare restrictions that "work best if you've got an admin
                # nearby", and the four relatives' houses have no admin and no way
                # to allowlist anything themselves -- a false positive there is a
                # phone call, not a self-service fix. The tier was chosen knowing
                # that; if breakage reports start arriving from one house rather
                # than from everywhere, NORMAL is the step back.
                #
                # 211,888 domains after deduplication, roughly 70% of the 300,000
                # ceiling. Threat intelligence is deliberately absent: Cloudflare's
                # own Security threats categories cover it for no list capacity at
                # all, where hagezi's TIF-mini would cost 170,000 and not fit.
                - name: BLOCKLIST_URLS
                  value: |-
                    https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt
                - name: ALLOWLIST_URLS
                  value: |-
                    https://raw.githubusercontent.com/sakib-m/Pi-hole-Torrent-Blocklist/refs/heads/main/all-torrent-trackers.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/banks.txt
                    https://raw.githubusercontent.com/Dogino/Discord-Phishing-URLs/main/official-domains.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/mac.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/windows.txt
                    https://raw.githubusercontent.com/boutetnico/url-shorteners/master/list.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/firefox.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/android.txt
                    https://raw.githubusercontent.com/TogoFire-Home/AD-Settings/main/Filters/whitelist.txt
                    https://raw.githubusercontent.com/DandelionSprout/AdGuard-Home-Whitelist/master/whitelist.txt
                    https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/master/Filters/exclusions.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/issues.txt
                    https://raw.githubusercontent.com/AdguardTeam/HttpsExclusions/master/exclusions/sensitive.txt
                    http://cloudflare-gateway-profile/allowlist.txt
              envFrom:
                - secretRef:
                    name: cloudflare-gateway-credentials
              securityContext:
                # No readOnlyRootFilesystem, alone among the workloads here. npm
                # runs scripts from the package root regardless of workingDir, so
                # the lists download into /app, which no volume covers. Setting it
                # gives a job that cannot fetch the lists it exists to upload.
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          restartPolicy: OnFailure
