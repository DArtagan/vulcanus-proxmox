# A copy of headscale's database, taken by a pod of our own: headscale's image
# has no shell to exec into.
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: headscale-sqlite
  labels:
    k8up-dump: "true"
spec:
  # .backup needs a seekable destination, hence the file before the cat.
  backupCommand: >-
    sh -c 'set -e; f=$(mktemp); trap "rm -f $f" EXIT;
    sqlite3 "/data/db.sqlite" ".backup $f"; test -s "$f"; cat "$f"'
  fileExtension: .headscale.sqlite
  pod:
    spec:
      # The database's owner, so any -wal or -shm this pod creates stays
      # usable by headscale.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: sqlite
          image: keinos/sqlite3:3.53.4 # {"$imagepolicy": "apps:k8up-sqlite3"}
          # Held open for K8up to exec into; tini passes on the stop signal.
          args: [tail, -f, /dev/null]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data-pvc
