apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 75.18.1 # {"$imagepolicy": "infrastructure:kube-prometheus:tag"}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: kube-prometheus
spec:
  image: ghcr.io/prometheus-community/charts/kube-prometheus-stack
  # This repository carries over 1100 tags, so scan it hourly rather than at the
  # 15m used for application images.
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kube-prometheus
spec:
  imageRepositoryRef:
    name: kube-prometheus
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Held to the current major until the stepped upgrade to 88.x is verified,
      # then widened to '>=88.1.5 <89.0.0'.
      range: '>=75.0.0 <76.0.0'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    alertmanager:
      enabled: false
    grafana:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        ingressClassName: ingress-nginx-internal
        hosts:
          - grafana.immortalkeep.com
        tls:
          - hosts:
              - grafana.immortalkeep.com
            secretName: prometheus-grafana-ingress-tls
    prometheus:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        ingressClassName: ingress-nginx-internal
        hosts:
          - prometheus.immortalkeep.com
        tls:
          - hosts:
              - prometheus.immortalkeep.com
            secretName: prometheus-ingress-tls
      prometheusSpec:
        retention: 30d
        #resources:
        #  requests:
        #    cpu: 200m
        #    memory: 200Mi
        ruleSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}
        podMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        probeSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeNamespaceSelector: {}
        serviceMonitorSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: grafana
spec:
  providerRef:
    name: grafana
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: flux-system
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: grafana
spec:
  type: grafana
  address: "http://kube-prometheus-stack-grafana.monitoring/api/annotations"
  secretRef:
    name: grafana-auth
