apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metallb
spec:
  interval: 1h
  url: oci://quay.io/metallb/chart/metallb
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.16.1 # {"$imagepolicy": "infrastructure:metallb:tag"}


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: metallb
spec:
  image: quay.io/metallb/chart/metallb
  interval: 1h


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: metallb
spec:
  imageRepositoryRef:
    name: metallb
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Note that metallb is still 0.x, so a minor here carries what a major
      # would elsewhere — 0.15 moved the CRDs into a subchart and 0.16 switched
      # the default FRR backend. Read the release notes when this crosses one.
      range: '>=0.16.1 <1.0.0'


---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: metallb
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    prometheus:
      serviceMonitor:
        enabled: true
      rbacPrometheus: false
      #serviceAccount: "kube-prometheus-metallb"
    # This cluster advertises purely over L2 — one L2Advertisement, no BGP — so
    # neither FRR backend is needed. 0.16 defaults frrk8s on and speaker.frr off,
    # which would swap the speaker's FRR sidecars for a separate frr-k8s
    # DaemonSet. Turning both off drops FRR entirely instead.
    speaker:
      frr:
        enabled: false
    frrk8s:
      enabled: false


---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: metallb
spec:
  addresses:
    - 192.168.0.201-192.168.0.210


---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: metallb
