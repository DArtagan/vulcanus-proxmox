- name: 'zfs configuration'
  hosts: proxmox
  vars:
    zpool: rpool

  tasks:
    - name: 'storage dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage"
        state: present

    - name: 'storage/filesync dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/filesync"
        state: present
      notify: 'add filesync dataset to proxmox'

    - name: 'storage/media dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/media"
        state: present
      notify: 'add media dataset to proxmox'

    - name: 'storage/photos dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/photos"
        state: present
      notify: 'add photos dataset to proxmox'

    - name: 'storage/books dataset'
      community.general.zfs:
        name: "{{ zpool }}/storage/books"
        state: present
      notify: 'add books dataset to proxmox'

    - name: 'backups/borg dataset'
      community.general.zfs:
        name: "{{ zpool }}/backups/borg"
        state: present
      notify: 'add backups/borg dataset to proxmox'

    - name: 'backups/restic dataset'
      community.general.zfs:
        name: "{{ zpool }}/backups/restic"
        state: present

    # The restic repository is bind-mounted into an unprivileged container,
    # which shifts every uid by 100000. NixOS gives the `restic` user uid 291,
    # so the container sees 291 and the host must see 100291 or rest-server
    # cannot write to its own repository. No `pvesm add dir` handler: a bind
    # mount is declared by host path in terraform/main.tf and never goes
    # through a PVE storage, so registering one would leave an entry nothing
    # reads -- which is exactly what had to be unpicked when `rancheros` was
    # destroyed.
    - name: 'backups/restic ownership, shifted for the unprivileged container'
      file:
        path: "/{{ zpool }}/backups/restic"
        owner: 100291
        group: 100291
        state: directory

    - name: 'proxmox_backup_server'
      community.general.zfs:
        name: "{{ zpool }}/proxmox_backup_server"
        state: present
      notify: 'add add_proxmox_backup_server dataset to the rpool'

  handlers:
    - name: 'add filesync dataset to proxmox'
      shell: pvesm add dir storage_filesync --path /rpool/storage/filesync --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add media dataset to proxmox'
      shell: pvesm add dir storage_media --path /rpool/storage/media --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add photos dataset to proxmox'
      shell: pvesm add dir storage_photos --path /rpool/storage/photos --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add books dataset to proxmox'
      shell: pvesm add dir storage_books --path /rpool/storage/books --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add backups/borg dataset to proxmox'
      shell: pvesm add dir backups_borg --path /rpool/backups/borg --is_mountpoint 1 --shared 0 --content snippets

    - name: 'add proxmox_backup_server dataset to the rpool'
      shell: pvesm add dir proxmox_backup_server --path /rpool/proxmox_backup_server --is_mountpoint 1 --shared 0 --content images
