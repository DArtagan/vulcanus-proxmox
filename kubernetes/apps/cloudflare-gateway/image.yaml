apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cloudflare-gateway-sync
spec:
  image: ghcr.io/dartagan/cloudflare-gateway-pihole-scripts
  interval: 15m0s


---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cloudflare-gateway-sync
spec:
  imageRepositoryRef:
    name: cloudflare-gateway-sync
  filterTags:
    pattern: '^\d{14}$'
  policy:
    alphabetical:
      order: asc
