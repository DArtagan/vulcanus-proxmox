# Custom alert rules, as opposed to the ones kube-prometheus-stack ships.
# The HelmRelease sets ruleSelector to {} with ruleSelectorNilUsesHelmValues
# false, so Prometheus picks these up without needing a matching label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: version-skew
spec:
  groups:
    - name: version-skew
      rules:
        # kube-proxy ran v1.27.7 against a v1.35.0 control plane for roughly
        # three years, unnoticed. Talos applies kube-proxy, CoreDNS and flannel
        # as bootstrap manifests, which are refreshed only by upgrade-k8s, while
        # the static pods and kubelet move with the OS upgrade — so the two
        # drift apart silently. Nothing reported it because Prometheus had no
        # Alertmanager to report to.
        #
        # Deliberately built on kube_pod_container_info rather than
        # kubernetes_build_info: that comes from kube-state-metrics, so it works
        # for components that expose no scrapeable metrics of their own. On
        # Talos those bind to localhost, which is exactly why their own scrapes
        # are disabled in prometheus.yaml. kube_node_info is no use either — its
        # kubeproxy_version label now reads literally "deprecated".
        - alert: KubernetesComponentVersionSkew
          expr: |
            count(
              count by (minor_version) (
                label_replace(
                  kube_pod_container_info{namespace="kube-system", container=~"kube-apiserver|kube-controller-manager|kube-scheduler|kube-proxy"},
                  "minor_version", "$1", "image_spec", ".*:v([0-9]+\\.[0-9]+)\\..*"
                )
              )
            ) > 1
          # Long enough to sit out a rolling upgrade, which legitimately leaves
          # components on different versions while it sequences through them.
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Kubernetes control plane components are on different minor versions.
            description: >-
              {{ $value }} distinct minor versions are running across
              kube-apiserver, kube-controller-manager, kube-scheduler and
              kube-proxy. Kubernetes supports one minor of skew. Compare them
              with:
              kubectl get pods -n kube-system -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\n"}{end}'
              and resync with:
              talosctl --nodes <control-plane> upgrade-k8s --from <current> --to <target>
              See todos/talos-terraform-migration-prompt.md.
---
# Replaces the chart's KubeJobFailed, which is disabled in prometheus.yaml — see
# the comment there for why. The short version: KubeJobFailed reports that a
# failed Job object exists, which is not the same question as whether the
# CronJob is currently working, and it can only be cleared by hand.
#
# These rules ask the question that actually matters: has this CronJob succeeded
# recently? A transient failure is invisible because the next run fixes it;
# sustained failure fires and then self-resolves on the first success, with no
# manual cleanup.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cronjob-health
spec:
  groups:
    - name: cronjob-health
      rules:
        # How long each CronJob may go without a success, bucketed by how often
        # it runs. Keyed on the schedule label of kube_cronjob_info rather than
        # on CronJob names, so a newly added CronJob lands in a bucket
        # automatically — a name list would leave it silently uncovered, and a
        # rule that covers less than it appears to is the failure mode this repo
        # keeps producing.
        #
        # `or` is first-match-wins per series, so the branches read top to bottom
        # as a table and the last one is an unconditional catch-all. Each branch
        # is multiplied by zero and offset so the value is the threshold itself
        # rather than kube_cronjob_info's constant 1.
        #
        # Prometheus regexes are fully anchored, and these sit inside PromQL
        # string literals, so `\\*` is what reaches the engine as `\*`:
        #   minute field contains / , or -  → sub-hourly  → 90m
        #   hour field is *                 → hourly      → 3h
        #   anything else                   → daily+      → 26h
        #
        # 90 minutes is roughly six missed rclone-dropbox runs. Its longest gap
        # between successes across a month of history is 83.5 minutes, and that
        # window contains a genuine Dropbox outage — so the budget clears real
        # breakage without paging for blips that heal themselves.
        - record: cronjob:max_seconds_without_success
          expr: |
            (max by (namespace, cronjob) (kube_cronjob_info{schedule=~"[^ ]*[/,-][^ ]* \\* \\* \\* \\*"}) * 0 + 5400)
            or
            (max by (namespace, cronjob) (kube_cronjob_info{schedule=~"[^ ]+ \\* \\* \\* \\*"}) * 0 + 10800)
            or
            (max by (namespace, cronjob) (kube_cronjob_info) * 0 + 93600)

        # The suspend guard is load-bearing, not defensive tidiness: beets-import
        # is suspended and its last success recedes further into the past every
        # day, so without the `unless` it fires immediately and permanently.
        - alert: CronJobNotSucceeding
          expr: |
            (
              max by (namespace, cronjob) (time() - kube_cronjob_status_last_successful_time)
                > on (namespace, cronjob) cronjob:max_seconds_without_success
            )
            unless on (namespace, cronjob) (kube_cronjob_spec_suspend == 1)
          labels:
            severity: warning
          annotations:
            summary: CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded recently.
            description: >-
              Its last successful run was {{ $value | humanizeDuration }} ago,
              past the budget for its schedule. This has outlasted several runs,
              so it is not a transient upstream blip. Inspect with:
              kubectl get jobs -n {{ $labels.namespace }} | grep {{ $labels.cronjob }}
              and read the logs of the most recent failure in VictoriaLogs, since
              the pod itself is likely gone — see docs/logging.md.

        # kube_cronjob_status_last_successful_time does not exist until a CronJob
        # has succeeded at least once, so CronJobNotSucceeding is structurally
        # blind to one that has never worked at all. This is the rule that sees
        # it: old enough to have had its chance, with no success on record.
        #
        # Age is measured from creation, not from last schedule time. A CronJob
        # that is scheduling normally and failing every time holds its last
        # schedule time within one cadence of now — 894s against a 5400s budget
        # for rclone-dropbox — so a schedule-time test can never cross the
        # threshold for exactly the workload this rule is meant to catch. Time
        # since creation climbs monotonically instead, and a recreated CronJob
        # gets one budget's grace before it counts.
        - alert: CronJobHasNeverSucceeded
          expr: |
            (
              max by (namespace, cronjob) (time() - kube_cronjob_created)
                > on (namespace, cronjob) cronjob:max_seconds_without_success
            )
            unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
            unless on (namespace, cronjob) (kube_cronjob_spec_suspend == 1)
          labels:
            severity: warning
          annotations:
            summary: CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has never completed successfully.
            description: >-
              It has existed for {{ $value | humanizeDuration }} with no successful
              run on record, so it has failed every time since it was created.
              Check that its image, secrets and volume mounts resolve:
              kubectl get jobs -n {{ $labels.namespace }} | grep {{ $labels.cronjob }}
---
# Two blind spots in the chart's own rules. A control plane that is OOM-killed
# and restarts cleanly satisfies every threshold the chart ships, so neither
# failure reaches an alert without these.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: control-plane-health
spec:
  groups:
    - name: control-plane-health
      rules:
        # Deliberately reads the kill rather than predicting it from a
        # utilisation percentage. MemAvailable counts reclaimable page cache, so
        # a node reads healthy right up until the kernel cannot allocate — the
        # control-plane node peaks at 80% against NodeMemoryHighUtilization's
        # 90% threshold while being OOM-killed on it.
        #
        # It also covers what no restart metric can: etcd and kubelet are Talos
        # host services rather than pods, so they have no
        # kube_pod_container_status_restarts_total series at all, and an
        # OOM-killed etcd is visible only here.
        #
        # Scoped to control-plane nodes because an OOM kill means something
        # different on each. The control-plane static pods carry no memory
        # limits, so a kill there is the node itself running out; on the workers
        # it is a container hitting its own cgroup limit, which is routine and
        # runs at several a day. Scoped by role rather than by naming a node, so
        # a second control-plane node is covered the day it joins. The join goes
        # through kube_node_info because node-exporter series carry no node
        # label, only instance.
        - alert: NodeOOMKill
          expr: |
            (
              max by (instance) (increase(node_vmstat_oom_kill[1h])) > 0
            )
            * on (instance) group_left(node)
            label_replace(
              kube_node_info * on (node) group_left() kube_node_role{role="control-plane"},
              "instance", "$1:9100", "internal_ip", "(.+)"
            )
          for: 5m
          labels:
            # Warning rather than critical: the control plane degrades but keeps
            # serving, and critical maps to a Pushover priority that overrides
            # quiet hours. This needs attention in the morning, not at 03:00.
            severity: warning
          annotations:
            summary: The kernel OOM killer fired on control-plane node {{ $labels.node }}.
            description: >-
              {{ $value | printf "%.0f" }} process(es) killed in the last hour.
              Control-plane components carry no memory limits, so this is the
              node running out, and the kernel picks the largest process — which
              is kube-apiserver. Check headroom with:
              kubectl top node {{ $labels.node }}
              and size the VM against the apiserver's peak, not its average —
              see docs/talos.md.

        # KubePodCrashLooping keys on the CrashLoopBackOff waiting reason, which
        # a static pod restarting every few hours never reaches: it restarts
        # cleanly and the backoff resets between times. Restart count is the
        # only measure that sees it.
        #
        # An event rate rather than a state, so this resolves by itself after an
        # hour of stability and cannot outlive the problem — the same reason
        # CronJobNotSucceeding above is written as it is. `> 0` means a Talos or
        # Kubernetes upgrade pages once, which is worth keeping: it is also how
        # you confirm the upgrade landed.
        - alert: ControlPlaneContainerRestarting
          expr: |
            sum by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total{
                namespace="kube-system",
                container=~"kube-apiserver|kube-controller-manager|kube-scheduler"
              }[1h])
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Control-plane container {{ $labels.container }} has restarted.
            description: >-
              {{ $value | printf "%.0f" }} restart(s) in the last hour. These do
              not restart in normal operation, so unless an upgrade is in
              progress something is killing them. kube-apiserver exiting takes
              controller-manager and scheduler with it when their
              leader-election leases go, so treat the apiserver as the cause and
              the other two as consequence. Read the exit code with:
              kubectl get pod -n kube-system {{ $labels.pod }}
              -o jsonpath='{.status.containerStatuses[*].lastState.terminated.exitCode}'
              — 137 is an OOM kill.
---
# Replaces the first branch of the chart's KubeMemoryOvercommit, which is
# disabled in prometheus.yaml — see the comment there for why the rule as
# shipped cannot be made to answer this. The question kept is the one worth
# asking: does the memory every pod declares actually fit in the space the
# scheduler can put it?
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-capacity
spec:
  groups:
    - name: cluster-capacity
      rules:
        # Both sides exclude NoSchedule nodes, which is the correction the
        # chart's version is missing. kube_node_status_allocatable reports what
        # a kubelet could allocate, not what the scheduler will place there, so
        # counting the control plane credits the cluster with ~3.2 GiB no
        # ordinary workload can ever use — and a rule that believes in capacity
        # it does not have fires that much too late. Excluding the node from
        # both halves keeps it consistent: the pods running there are
        # DaemonSets and static pods, which are not competing for worker room.
        #
        # Running and Pending only. A completed Job's pod still carries its
        # requests, and counting those inflates the total by several GiB while
        # reserving nothing.
        - record: cluster:memory_requests_schedulable:ratio
          expr: |
            sum(
              (kube_pod_container_resource_requests{resource="memory"}
                * on (namespace, pod) group_left() (kube_pod_status_phase{phase=~"Running|Pending"} == 1))
              unless on (node) kube_node_spec_taint{effect="NoSchedule"}
            )
            /
            sum(
              kube_node_status_allocatable{resource="memory"}
              unless on (node) kube_node_spec_taint{effect="NoSchedule"}
            )

        - alert: MemoryRequestsNearCapacity
          expr: cluster:memory_requests_schedulable:ratio > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod memory requests are at {{ $value | humanizePercentage }} of schedulable capacity.
            description: >-
              Once requests exceed what the untainted nodes can allocate, new
              pods stay Pending. This is a total, so it cannot see bin-packing —
              a single pod larger than any one node's free space fails to
              schedule well before this fires, and KubePodNotReady is what
              catches that. Review the largest requests with:
              kubectl top pod -A --sort-by=memory
              and compare against kubectl describe node.

        # Firing together with the warning above is intended, and is the pattern
        # the chart itself uses for NodeFilesystemAlmostOutOfSpace. Crossing
        # this threshold means the declared workload does not fit, which is a
        # different situation from approaching the line, and the duplicate
        # notification is not the problem worth optimising at that point.
        - alert: MemoryRequestsExceedCapacity
          expr: cluster:memory_requests_schedulable:ratio > 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Pod memory requests exceed schedulable capacity ({{ $value | humanizePercentage }}).
            description: >-
              More memory is requested than the untainted nodes can allocate, so
              something is Pending or will be at the next reschedule. Either give
              the workers more memory in terraform/main.tf, or reduce requests —
              note these are requests rather than usage, so the fix may be a
              request set higher than the workload needs.
