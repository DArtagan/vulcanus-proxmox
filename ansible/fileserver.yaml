# Note: the fileserver must be completely recreated to add new mount points to it

- name: 'set up a fileserver'
  hosts: fileserver
  vars:
    samba_groups:
      - groupname: users
        gid: 1100
      - groupname: fileshare
        gid: 1200
    samba_users:
      # The cluster's storage account: the only login on every share but
      # [media], and the identity the NFS exports squash to (ansible/nfs.yaml).
      # Desktops connect as guests, which is nobody.
      - username: piraeus
        password: "{{ smb_credentials.data.password | b64decode }}"
        uid: 1100
        group: 1100
        groups: fileshare
      - username: nobody
        uid: 65534
        group: nogroup
        groups: nogroup,fileshare

  tasks:
    # The Secret the cluster mounts with is the only copy of the password.
    - name: read the cluster's SMB credentials
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../kubernetes/infrastructure/smb-credentials.sops.yaml"
        name: smb_credentials
      no_log: true

    - name: install samba
      apt:
        name: samba
        update_cache: yes
        state: present

    - name: create samba groups
      ansible.builtin.group:
        name: "{{ item.groupname }}"
        gid: "{{ item.gid }}"
      with_items: "{{ samba_groups }}"
      loop_control:
        label: "{{ item.groupname }}"

    - name: create samba users
      ansible.builtin.user:
        name: "{{ item.username }}"
        uid: "{{ item.uid }}"
        create_home: false
        group: "{{ item.uid }}"
        groups: "{{ item.groups }}"
      with_items: "{{ samba_users }}"
      loop_control:
        label: "{{ item.username }}"

    # Samba keeps only a hash it cannot compare against, and there is no
    # smbclient to test a login with, so a root-only digest of the password
    # last set says whether it has changed. The password travels by environment,
    # not argv, so it is not in the process list.
    - name: set samba passwords
      with_items: "{{ samba_users | selectattr('password', 'defined') }}"
      ansible.builtin.shell: |
        set -eu
        marker=/etc/samba/.password-{{ item.username }}.sha256
        want=$(printf %s "$PASSWORD" | sha256sum | cut -d' ' -f1)
        if pdbedit -u {{ item.username }} >/dev/null 2>&1 \
            && [ -f "$marker" ] && [ "$(cat "$marker")" = "$want" ]; then
          echo unchanged
          exit 0
        fi
        printf '%s\n%s\n' "$PASSWORD" "$PASSWORD" | smbpasswd -s -a {{ item.username }}
        umask 077
        printf %s "$want" > "$marker"
        echo changed
      args:
        executable: /bin/bash
      environment:
        PASSWORD: "{{ item.password }}"
      register: smbpasswd
      changed_when: "'changed' in smbpasswd.stdout"
      no_log: true

    - name: create samba configuration
      template:
        dest: /etc/samba/smb.conf
        src: smb.conf.j2
        owner: root
        group: root
        mode: '0600'
      notify: reload samba config

    - name: start samba and enable on boot
      systemd:
        name: smbd
        enabled: yes
        state: started

  handlers:
    - name: reload samba config
      shell: smbcontrol all reload-config
      args:
        executable: /bin/bash
