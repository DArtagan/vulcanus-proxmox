apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 15m  # 24h
  url: https://grafana.github.io/helm-charts

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: loki
spec:
  interval: 1h
  url: oci://ghcr.io/grafana/helm-charts/loki
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.30.1  # {"$imagepolicy": "infrastructure:loki:tag"}

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: loki
spec:
  image: ghcr.io/grafana/helm-charts/loki
  interval: 1h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: loki
spec:
  imageRepositoryRef:
    name: loki
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Held to the current minor until the upgrade to 7.x is verified, then
      # widened to '>=7.2.0 <8.0.0'.
      range: '>=6.30.1 <6.31.0'

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: loki
  # The default 5m Helm timeout is not enough for the singleBinary StatefulSet
  # to roll its PVC, which left this release Stalled with RetriesExceeded.
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary<->SimpleScalable
    loki:
      auth_enabled: false
      isDefault: false
      schemaConfig:
        configs:
          - from: "2025-06-18"
            object_store: filesystem
            schema: v13
            store: tsdb
            index:
              period: 24h
              prefix: index_
      limits_config:
        retention_period: 30d
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # Must live under loki: — this block is Loki's own configuration. The
      # top-level compactor: key is the Kubernetes component used in scalable
      # mode and has no retention settings at all, so keeping these there meant
      # retention_period was never enforced and nothing was ever deleted.
      compactor:
        delete_request_store: filesystem
        retention_enabled: true
        working_directory: /var/loki/compactor
    singleBinary:
      replicas: 1
      persistence:
        storageClass: openebs-hostpath


---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
spec:
  interval: 5m
  chart:
    spec:
      chart: promtail
      version: 6.11.5
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 60m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
